<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌单 · 牦牛音乐</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .playlist-hero {
      display: flex; align-items: flex-end; gap: 28px;
      padding: 40px 0; margin-bottom: 32px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .playlist-hero-cover {
      width: 180px; height: 180px; border-radius: var(--radius);
      background: linear-gradient(135deg, #2a2a35, #1a1a22);
      display: flex; align-items: center; justify-content: center;
      font-size: 64px; color: rgba(255,255,255,0.15);
      flex-shrink: 0;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .playlist-hero-cover img { width: 100%; height: 100%; object-fit: cover; }
    .playlist-hero-info { flex: 1; min-width: 0; }
    .playlist-hero-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .playlist-hero-name { font-size: 44px; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 12px; line-height: 1.1; }
    .playlist-hero-meta { font-size: 14px; color: var(--text-dim); margin-bottom: 16px; }
    .playlist-hero-actions { display: flex; gap: 10px; }

    .song-row-actions {
      opacity: 0;
      transition: opacity 0.15s;
      display: flex; gap: 6px;
    }
    .song-row:hover .song-row-actions { opacity: 1; }
    .icon-btn {
      width: 28px; height: 28px; border-radius: 50%;
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--text); }
    .icon-btn.danger:hover { color: var(--danger); }

    @media (max-width: 700px) {
      .playlist-hero { flex-direction: column; align-items: center; text-align: center; padding: 24px 0; }
      .playlist-hero-cover { width: 140px; height: 140px; font-size: 48px; }
      .playlist-hero-name { font-size: 28px; }
    }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">🎵</div>
      <div class="brand-name">牦牛<span>音乐</span></div>
    </div>
    <div class="nav-section">
      <div class="nav-label">返回</div>
      <button class="nav-item" onclick="location.href='index.html'">
        <span class="icon">←</span><span>回到首页</span>
      </button>
      <button class="nav-item" onclick="location.href='profile.html'">
        <span class="icon">👤</span><span>个人中心</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-toggle" onclick="location.href='index.html'">←</button>
      <div class="page-title" id="pageTitle">歌单</div>
    </div>
    <div class="content" id="content">
      <div class="empty"><div class="empty-text">加载中...</div></div>
    </div>
  </main>
</div>

<audio id="audio"></audio>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  const audio = document.getElementById('audio');
  const content = document.getElementById('content');
  const params = new URLSearchParams(location.search);
  const playlistId = params.get('id');

  let currentUser = null;
  let playlist = null;
  let songs = [];       // 歌单里的歌
  let currentIndex = 0;
  let isPlaying = false;

  function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = t == null ? '' : t;
    return d.innerHTML;
  }
  function getInitial(n) { return n ? n.trim().charAt(0).toUpperCase() : '?'; }

  async function init() {
    if (!playlistId) {
      content.innerHTML = '<div class="empty"><div class="empty-text">未指定歌单</div></div>';
      return;
    }

    const session = await getSession();
    if (!session) {
      content.innerHTML = '<div class="empty"><div class="empty-icon">🔒</div><div class="empty-text">请先登录<br><br><button class="btn btn-primary" onclick="location.href=\'auth.html\'">去登录</button></div></div>';
      return;
    }
    currentUser = session.user;

    // 拉歌单
    const { data: pl, error: plErr } = await supabaseClient
      .from('playlists').select('*').eq('id', playlistId).single();

    if (plErr || !pl) {
      content.innerHTML = '<div class="empty"><div class="empty-text">歌单不存在</div></div>';
      return;
    }
    if (pl.user_id !== currentUser.id) {
      content.innerHTML = '<div class="empty"><div class="empty-text">你没有权限查看这个歌单</div></div>';
      return;
    }
    playlist = pl;

    // 拉歌单里的歌
    const { data: rows, error: rowsErr } = await supabaseClient
      .from('playlist_songs')
      .select('song_id, added_at, songs(*)')
      .eq('playlist_id', playlistId)
      .order('added_at', { ascending: true });

    if (rowsErr) {
      content.innerHTML = '<div class="empty"><div class="empty-text">加载失败：' + escapeHtml(rowsErr.message) + '</div></div>';
      return;
    }

    songs = (rows || []).map(function(r) { return r.songs; }).filter(Boolean);

    render();
  }

  function render() {
    const coverHtml = songs.length > 0 && songs[0].cover_url
      ? '<img src="' + songs[0].cover_url + '">'
      : '📁';

    content.innerHTML = `
      <div class="playlist-hero">
        <div class="playlist-hero-cover">${coverHtml}</div>
        <div class="playlist-hero-info">
          <div class="playlist-hero-label">歌单</div>
          <div class="playlist-hero-name">${escapeHtml(playlist.name)}</div>
          <div class="playlist-hero-meta">${songs.length} 首歌曲</div>
          <div class="playlist-hero-actions">
            <button class="btn btn-primary" onclick="playAll()">▶ 播放全部</button>
            <button class="btn btn-ghost" onclick="renamePlaylist()">重命名</button>
          </div>
        </div>
      </div>
      <div class="song-list" id="songList"></div>
    `;
    renderList();
  }

  function renderList() {
    const listEl = document.getElementById('songList');
    if (songs.length === 0) {
      listEl.innerHTML = '<div class="empty"><div class="empty-text">这个歌单还没有歌曲<br><br>去「全部歌曲」点歌曲卡片上的 ➕ 添加</div></div>';
      return;
    }

    listEl.innerHTML = songs.map(function(song, i) {
      const active = isPlaying && i === currentIndex;
      const coverHtml = song.cover_url
        ? '<img src="' + song.cover_url + '">'
        : '🎵';
      return `
        <div class="song-row${active ? ' active' : ''}" onclick="playIndex(${i})">
          <div class="row-index">${i + 1}</div>
          <div class="row-cover">${coverHtml}</div>
          <div class="row-info">
            <div class="row-title">${escapeHtml(song.title)}</div>
            <div class="row-meta">${escapeHtml(song.artist || '未知歌手')}</div>
          </div>
          <div class="song-row-actions">
            <button class="icon-btn danger" onclick="event.stopPropagation(); removeSong(${song.id})" title="从歌单移除">✕</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function playAll() {
    if (songs.length === 0) return;
    playIndex(0);
  }

  function playIndex(i) {
    if (i < 0 || i >= songs.length) return;
    if (i === currentIndex && audio.src && !audio.paused) {
      audio.pause();
      return;
    }
    currentIndex = i;
    audio.src = songs[i].audio_url;
    audio.play().catch(function(){});
    renderList();
  }

  async function removeSong(songId) {
    if (!confirm('从歌单移除这首歌？')) return;
    const { error } = await supabaseClient
      .from('playlist_songs').delete()
      .eq('playlist_id', playlistId).eq('song_id', songId);
    if (error) { alert('移除失败：' + error.message); return; }
    songs = songs.filter(function(s) { return s.id !== songId; });
    render();
  }

  async function renamePlaylist() {
    const name = prompt('新的歌单名称：', playlist.name);
    if (!name || !name.trim()) return;
    const { error } = await supabaseClient.from('playlists').update({ name: name.trim() }).eq('id', playlistId);
    if (error) { alert('重命名失败：' + error.message); return; }
    playlist.name = name.trim();
    render();
  }

  audio.addEventListener('play', function() { isPlaying = true; renderList(); });
  audio.addEventListener('pause', function() { isPlaying = false; renderList(); });
  audio.addEventListener('ended', function() {
    playIndex((currentIndex + 1) % songs.length);
  });

  init();
</script>

</body>
</html>
