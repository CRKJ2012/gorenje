<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 · 牦牛音乐</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .profile-header {
      display: flex; align-items: center; gap: 24px;
      padding: 32px 0; margin-bottom: 32px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .profile-avatar {
      width: 100px; height: 100px; border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 700; color: #fff;
      box-shadow: 0 12px 32px rgba(139,92,246,0.4);
      flex-shrink: 0;
    }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
    .profile-phone { font-size: 14px; color: var(--text-dim); }

    .stats-row { display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
    .stat-card {
      flex: 1; min-width: 120px;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stat-value { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .stat-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .section-title { font-size: 18px; font-weight: 700; }
    .section-actions { display: flex; gap: 8px; }

    /* 歌单卡片 */
    .playlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }
    .playlist-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
    }
    .playlist-card:hover { transform: translateY(-4px); border-color: rgba(139,92,246,0.3); box-shadow: 0 12px 32px rgba(0,0,0,0.3); }
    .playlist-cover {
      width: 100%; aspect-ratio: 1;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #2a2a35, #1a1a22);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; color: rgba(255,255,255,0.15);
      margin-bottom: 12px;
      overflow: hidden;
    }
    .playlist-cover img { width: 100%; height: 100%; object-fit: cover; }
    .playlist-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .playlist-count { font-size: 12px; color: var(--text-dim); }

    .playlist-delete {
      position: absolute; top: 12px; right: 12px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,0.6);
      color: #fff; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .playlist-card:hover .playlist-delete { opacity: 1; }
    .playlist-delete:hover { background: var(--danger); }

    .login-prompt {
      text-align: center; padding: 80px 20px;
    }
    .login-prompt-icon { font-size: 64px; margin-bottom: 20px; opacity: 0.4; }
    .login-prompt-text { font-size: 16px; color: var(--text-dim); margin-bottom: 24px; }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">🎵</div>
      <div class="brand-name">牦牛<span>音乐</span></div>
    </div>
    <div class="nav-section">
      <div class="nav-label">返回</div>
      <button class="nav-item" onclick="location.href='index.html'">
        <span class="icon">←</span><span>回到首页</span>
      </button>
    </div>
    <div class="nav-section">
      <div class="nav-label">账号</div>
      <button class="nav-item active">
        <span class="icon">👤</span><span>个人中心</span>
      </button>
      <button class="nav-item" onclick="handleLogout()">
        <span class="icon">🚪</span><span>退出登录</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-toggle" onclick="location.href='index.html'">←</button>
      <div class="page-title">个人中心</div>
    </div>
    <div class="content" id="content">
      <div class="empty"><div class="empty-text">加载中...</div></div>
    </div>
  </main>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  const content = document.getElementById('content');
  let currentUser = null;

  function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = t == null ? '' : t;
    return d.innerHTML;
  }

  async function init() {
    const session = await getSession();
    if (!session) {
      renderLoginPrompt();
      return;
    }
    currentUser = session.user;
    await loadProfile();
  }

  function renderLoginPrompt() {
    content.innerHTML = `
      <div class="login-prompt">
        <div class="login-prompt-icon">🔒</div>
        <div class="login-prompt-text">登录后查看个人中心</div>
        <button class="btn btn-primary" onclick="location.href='auth.html'">去登录</button>
      </div>
    `;
  }

  async function loadProfile() {
    const meta = currentUser.user_metadata || {};
    const nickname = meta.nickname || meta.phone || '用户';
    const phone = meta.phone || '未绑定';

    // 统计
    const [likesRes, playlistsRes, historyRes] = await Promise.all([
      supabaseClient.from('liked_songs').select('id', { count: 'exact', head: true }).eq('user_id', currentUser.id),
      supabaseClient.from('playlists').select('id', { count: 'exact', head: true }).eq('user_id', currentUser.id),
      supabaseClient.from('play_history').select('id', { count: 'exact', head: true }).eq('user_id', currentUser.id),
    ]);

    const likeCount = likesRes.count || 0;
    const playlistCount = playlistsRes.count || 0;
    const historyCount = historyRes.count || 0;

    // 拉歌单
    const { data: playlists } = await supabaseClient
      .from('playlists').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });

    const playlistHtml = (playlists || []).map(function(p) {
      return `
        <div class="playlist-card" onclick="location.href='playlist.html?id=${p.id}'">
          <button class="playlist-delete" onclick="event.stopPropagation(); deletePlaylist(${p.id})" title="删除">✕</button>
          <div class="playlist-cover">📁</div>
          <div class="playlist-name">${escapeHtml(p.name)}</div>
          <div class="playlist-count">${p.description || '歌单'}</div>
        </div>
      `;
    }).join('');

    content.innerHTML = `
      <div class="profile-header">
        <div class="profile-avatar">${escapeHtml(nickname.charAt(0).toUpperCase())}</div>
        <div class="profile-info">
          <div class="profile-name">${escapeHtml(nickname)}</div>
          <div class="profile-phone">📱 ${escapeHtml(phone)}</div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card" onclick="location.href='index.html'" style="cursor:pointer;">
          <div class="stat-value">${likeCount}</div>
          <div class="stat-label">喜欢的歌曲</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${playlistCount}</div>
          <div class="stat-label">我的歌单</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${historyCount}</div>
          <div class="stat-label">播放次数</div>
        </div>
      </div>

      <div class="section-header">
        <div class="section-title">我的歌单</div>
        <div class="section-actions">
          <button class="btn btn-primary btn-sm" onclick="createPlaylist()">+ 新建歌单</button>
        </div>
      </div>
      <div class="playlist-grid">
        ${playlistHtml || '<div class="empty" style="grid-column:1/-1;padding:40px;"><div class="empty-text">还没有歌单，点「新建歌单」创建一个</div></div>'}
      </div>
    `;
  }

  async function createPlaylist() {
    const name = prompt('歌单名称：');
    if (!name || !name.trim()) return;

    const { error } = await supabaseClient.from('playlists').insert({
      user_id: currentUser.id,
      name: name.trim(),
    });

    if (error) { alert('创建失败：' + error.message); return; }
    loadProfile();
  }

  async function deletePlaylist(id) {
    if (!confirm('确定删除这个歌单吗？')) return;
    const { error } = await supabaseClient.from('playlists').delete().eq('id', id);
    if (error) { alert('删除失败：' + error.message); return; }
    loadProfile();
  }

  async function handleLogout() {
    if (!confirm('确定退出登录吗？')) return;
    await signOut();
    location.href = 'index.html';
  }

  init();
</script>

</body>
</html>
