<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牦牛影视 · 管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #08080a; --panel: #121216; --line: #22222a;
    --text: #f0f0f5; --muted: #8e8e9c; --accent: #ff4757;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; min-height: 100vh; font-size: 14px; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

  .top { display: flex; align-items: center; gap: 16px; padding: 0 40px; height: 72px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 100; }
  .brand { font-size: 20px; font-weight: 900; } .brand span { color: var(--accent); }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 30px 20px 60px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 24px; overflow: hidden; }
  .box-hd { padding: 18px 24px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; }
  .box-bd { padding: 24px; }

  .row { display: flex; gap: 12px; margin-bottom: 12px; } .row:last-child { margin-bottom: 0; }
  input { width: 100%; padding: 12px 16px; background: #0a0a0c; border: 1px solid var(--line); border-radius: 10px; color: #fff; font-size: 13.5px; font-family: inherit; outline: none; transition: .2s; }
  input:focus { border-color: var(--accent); }

  button { padding: 0 24px; height: 42px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: .2s; white-space: nowrap; }
  button:hover { background: #ff6b81; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); } button.ghost:hover { background: #222; }
  button.success { background: #2ed573; color: #000; } button.success:hover { background: #3ae082; }
  button.danger { background: transparent; border: 1px solid #661a22; color: #ff4757; } button.danger:hover { background: #ff4757; color: #fff; }

  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; } .msg { font-size: 12px; color: var(--accent); margin-top: 8px; min-height: 16px; }

  .item { background: #0a0a0c; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .item-hd { display: flex; align-items: center; padding: 16px 20px; cursor: pointer; transition: .2s; }
  .item-hd:hover { background: #15151a; }
  .item.open .item-hd { background: #15151a; border-bottom: 1px solid var(--line); }
  .item-hd .nm { flex: 1; font-weight: 700; font-size: 15px; }
  .item-hd .ct { font-size: 12px; color: var(--muted); margin-right: 16px; }
  .item-hd .arw { font-size: 12px; color: var(--muted); transition: .2s; }
  .item.open .arw { transform: rotate(180deg); }

  .eps { display: none; padding: 16px; flex-direction: column; gap: 8px; }
  .item.open .eps { display: flex; }
  .ep-row { display: flex; align-items: center; gap: 12px; background: #121216; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); }
  .ep-row .info { flex: 1; min-width: 0; } .ep-row .n { font-weight: 600; font-size: 13px; } .ep-row .u { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .ep-row .mini { height: 28px; padding: 0 12px; font-size: 11px; }

  .sub-card { border: 1px solid #3a2515; background: #1a100a; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .sub-card h4 { color: #ff9f43; font-size: 16px; margin-bottom: 8px; }
  .sub-card p { font-size: 13px; color: #ccc; margin-bottom: 12px; line-height: 1.5; }
  .sub-actions { display: flex; gap: 10px; margin-top: 12px; }

  footer { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); line-height: 1.8; }
</style>
</head>
<body>

<header class="top">
  <div class="brand">牦牛<span>影视</span> · 后台</div>
</header>

<div class="wrap">
  <div class="box" id="subBox" style="display:none; border-color:#5a3a1a;">
    <div class="box-hd" style="color:#ff9f43; border-bottom-color:#3a2515;">🔔 用户投稿审核 <span id="subCount" style="font-size:12px; background:#ff9f43; color:#000; padding:2px 8px; border-radius:10px;">0</span></div>
    <div class="box-bd" id="subList"></div>
  </div>

  <div class="box">
    <div class="box-hd">新建 / 选择剧</div>
    <div class="box-bd">
      <div class="row">
        <input id="dramaInput" type="text" placeholder="输入剧名，如：中国奇谭2" maxlength="50">
        <button id="createBtn">创建 / 选择</button>
      </div>
      <div class="hint">同名剧已存在则直接选中。</div>
      <div class="msg" id="dramaMsg"></div>
    </div>
  </div>

  <div class="box" id="epPanel" style="display:none">
    <div class="box-hd" id="panelTitle">当前选中</div>
    <div class="box-bd">
      <div style="font-weight:700; margin-bottom:12px; font-size:14px;">添加剧集</div>
      <div class="row"><input id="epName" type="text" placeholder="集名，如：第一集" maxlength="50"></div>
      <div class="row">
        <input id="epUrl" type="text" placeholder="https://.../index.m3u8">
        <button id="addEpBtn">添加</button>
      </div>
      <div class="msg" id="epMsg"></div>
    </div>
  </div>

  <div class="box">
    <div class="box-hd">已发布的全部剧集 <span id="totalLabel" style="font-size:12px;font-weight:400;color:var(--muted)">0 部</span></div>
    <div class="box-bd" style="padding:12px" id="list"><div class="empty">正在读取...</div></div>
  </div>
</div>

<footer>
  <div style="margin-bottom:12px; max-width:600px; margin-inline:auto; color:#888;">
    ⚠️ 免责声明：此网站可能含第三方广告，广告收入均为影视方所有，本网站不涉及任何盈利！
  </div>
  <div>灿然科技 ©2026 版权所有</div>
  <div>牦牛工作室</div>
</footer>

<script>
  const SUPABASE_URL = 'https://ymcoydzvtxtxaijtbuuy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_5aF8sRl4HyXNCh5zZnmVgA_SLiuPUBB';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let dramas = [], currentId = null, openIds = new Set();

  function chineseToNumber(str) {
    const map = { '零':0, '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9, '十':10 };
    if (str.includes('十')) { const p = str.split('十'); return (p[0]?map[p[0]]:1)*10 + (p[1]?map[p[1]]:0); }
    return map[str] || 0;
  }
  function getEpNumber(name) {
    if (!name) return Infinity;
    const str = String(name);
    let m = str.match(/\d+/); if (m) return parseInt(m[0], 10);
    m = str.match(/[一二三四五六七八九十]+/); if (m) return chineseToNumber(m[0]);
    return Infinity;
  }
  function naturalCompare(a, b) {
    const na = getEpNumber(a), nb = getEpNumber(b);
    return na !== nb ? na - nb : String(a).localeCompare(String(b), 'zh-CN');
  }

  async function loadDramas() {
    const { data, error } = await db.from('dramas').select('id,title,episodes(id,name,url)').order('created_at', { ascending: false });
    if (error) { document.getElementById('list').innerHTML = '加载失败'; return; }
    dramas = data || [];
    dramas.forEach(d => { if (d.episodes) d.episodes.sort((a, b) => naturalCompare(a.name, b.name)); });
    renderList();
  }

  function renderList() {
    document.getElementById('totalLabel').textContent = dramas.length + ' 部';
    const listEl = document.getElementById('list');
    listEl.innerHTML = '';
    if (!dramas.length) { listEl.innerHTML = '<div class="empty">暂无剧集</div>'; return; }

    dramas.forEach(d => {
      const isOpen = openIds.has(d.id) || currentId === d.id;
      const wrap = document.createElement('div');
      wrap.className = 'item' + (isOpen ? ' open' : '');
      wrap.innerHTML = `
        <div class="item-hd">
          <span class="nm">${d.title}</span>
          <span class="ct">${d.episodes?.length || 0} 集</span>
          <button class="danger" style="height:26px;padding:0 10px;font-size:11px;margin-right:12px" onclick="deleteDrama(event, ${d.id})">删除整部</button>
          <span class="arw">▼</span>
        </div>
        <div class="eps"></div>
      `;
      wrap.querySelector('.item-hd').addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        if (openIds.has(d.id)) openIds.delete(d.id); else openIds.add(d.id);
        currentId = d.id;
        syncPanel();
        renderList();
      });

      const epsEl = wrap.querySelector('.eps');
      d.episodes?.forEach(ep => {
        const row = document.createElement('div');
        row.className = 'ep-row';
        row.innerHTML = `
          <div class="info"><div class="n">${ep.name}</div><div class="u">${ep.url}</div></div>
          <button class="ghost mini" style="height:26px" onclick="deleteEp(event, ${d.id}, ${ep.id})">删除</button>
        `;
        epsEl.appendChild(row);
      });
      listEl.appendChild(wrap);
    });
  }

  async function deleteDrama(e, id) {
    e.stopPropagation();
    if (!confirm('确定删除整部剧？')) return;
    await db.from('dramas').delete().eq('id', id);
    if (currentId === id) { currentId = null; syncPanel(); }
    loadDramas();
  }

  async function deleteEp(e, dramaId, epId) {
    e.stopPropagation();
    if (!confirm('确定删除该集？')) return;
    const d = dramas.find(x => x.id === dramaId);
    const newEps = d.episodes.filter(x => x.id !== epId);
    await db.from('dramas').update({ episodes: newEps }).eq('id', dramaId);
    loadDramas();
  }

  function syncPanel() {
    const d = dramas.find(x => x.id === currentId);
    if (d) {
      document.getElementById('epPanel').style.display = 'block';
      document.getElementById('panelTitle').textContent = '当前选中：' + d.title;
    } else {
      document.getElementById('epPanel').style.display = 'none';
    }
  }

  document.getElementById('createBtn').addEventListener('click', async () => {
    const name = document.getElementById('dramaInput').value.trim();
    if (!name) return;
    const ex = dramas.find(d => d.title === name);
    if (ex) { currentId = ex.id; openIds.add(ex.id); syncPanel(); renderList(); return; }
    const { data, error } = await db.from('dramas').insert({ title: name }).select().single();
    if (error) { alert(error.message); return; }
    currentId = data.id; openIds.add(data.id); document.getElementById('dramaInput').value = '';
    loadDramas();
  });

  document.getElementById('addEpBtn').addEventListener('click', async () => {
    if (!currentId) return;
    const name = document.getElementById('epName').value.trim();
    const url = document.getElementById('epUrl').value.trim();
    if (!name || !url) return;
    const d = dramas.find(x => x.id === currentId);
    const newEp = { id: Date.now(), name, url };
    const newEps = [...(d.episodes || []), newEp];
    await db.from('dramas').update({ episodes: newEps }).eq('id', currentId);
    document.getElementById('epName').value = ''; document.getElementById('epUrl').value = '';
    loadDramas();
  });

  async function loadSubmissions() {
    const { data, error } = await db.from('submissions').select('*').order('created_at', { ascending: false });
    if (error) return;
    const list = document.getElementById('subList');
    if (!data || data.length === 0) { document.getElementById('subBox').style.display = 'none'; return; }
    
    document.getElementById('subBox').style.display = 'block';
    document.getElementById('subCount').textContent = data.length;
    list.innerHTML = '';
    
    data.forEach(sub => {
      const el = document.createElement('div');
      el.className = 'sub-card';
      el.innerHTML = `
        <h4>${sub.title}</h4>
        <p>备注：${sub.note || '无'}</p>
        <div class="sub-actions">
          <button class="danger" onclick="rejectSub(${sub.id})">✔ 已阅并删除</button>
        </div>
      `;
      list.appendChild(el);
    });
  }

  window.rejectSub = async (id) => {
    if (!confirm('确定删除这条投稿吗？')) return;
    await db.from('submissions').delete().eq('id', id);
    loadSubmissions();
  };

  loadDramas();
  loadSubmissions();
</script>
</body>
</html>
