<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牦牛音乐 · 后台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; }
body { background:#0f0f13; color:#e8e8ed; padding:24px; min-height:100vh; }
.container { max-width:1100px; margin:0 auto; }
h1 { font-size:22px; margin-bottom:24px; }
h1 span { color:#8b5cf6; }

.tabs { display:flex; background:#1a1a24; border-radius:12px; padding:4px; margin-bottom:20px; max-width:700px; }
.tab { flex:1; padding:10px; border-radius:8px; border:none; background:none; color:#888; cursor:pointer; font-size:14px; font-weight:500; transition:all 0.15s; }
.tab.active { background:#8b5cf6; color:#fff; }

.card { background:#1a1a24; border-radius:14px; padding:22px; margin-bottom:18px; border:1px solid #2a2a3a; }
.card h3 { margin-bottom:16px; font-size:15px; color:#a78bfa; }

.form-row { display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.form-row > div { flex:1; min-width:150px; }
.form-row label { display:block; font-size:12px; color:#888; margin-bottom:6px; }
.form-row input[type="text"], .form-row select { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #2a2a3a; background:#0f0f13; color:#fff; font-size:14px; }
.form-row input[type="text"]:focus, .form-row select:focus { outline:none; border-color:#8b5cf6; }

.file-input { padding:10px; border:1px dashed #3a3a4a; border-radius:8px; width:100%; background:#0f0f13; color:#ccc; cursor:pointer; }
.file-input:hover { border-color:#8b5cf6; }
textarea.file-input { font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.5; resize:vertical; min-height:120px; }
textarea.file-input:focus { outline:none; border-color:#8b5cf6; }

.preview img { max-width:100px; max-height:100px; border-radius:8px; margin-top:8px; }

.btn { padding:10px 20px; border-radius:8px; border:none; cursor:pointer; font-size:14px; font-weight:500; transition:all 0.15s; }
.btn-primary { background:#8b5cf6; color:#fff; }
.btn-primary:hover { background:#7c3aed; }
.btn-primary:disabled { background:#444; cursor:not-allowed; }
.btn-danger { background:#ef4444; color:#fff; }
.btn-ghost { background:#2a2a3a; color:#ccc; }
.btn-ghost:hover { background:#3a3a4a; }
.btn-sm { padding:6px 12px; font-size:12px; }

.status { font-size:13px; color:#888; margin-top:8px; }

.chip-list { display:flex; flex-wrap:wrap; gap:6px; min-height:38px; padding:8px; background:#0f0f13; border:1px solid #2a2a3a; border-radius:8px; }
.chip { display:inline-flex; align-items:center; gap:6px; background:rgba(139,92,246,0.2); color:#a78bfa; padding:4px 10px; border-radius:20px; font-size:13px; }
.chip button { background:none; border:none; color:inherit; cursor:pointer; font-size:14px; line-height:1; }
.chip-select { display:flex; gap:8px; align-items:center; }
.chip-select select { flex:1; padding:10px 12px; border-radius:8px; border:1px solid #2a2a3a; background:#0f0f13; color:#fff; }

.item-row { display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid #2a2a3a; }
.item-row:last-child { border-bottom:none; }
.item-cover { width:48px; height:48px; border-radius:8px; object-fit:cover; background:#2a2a3a; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#555; }
.item-cover.round { border-radius:50%; }
.item-info { flex:1; min-width:0; }
.item-title { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-meta { font-size:12px; color:#888; margin-top:2px; }
.item-actions { display:flex; gap:6px; flex-shrink:0; }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
.modal-overlay.hidden { display:none; }
.modal { background:#1a1a24; padding:24px; border-radius:14px; width:100%; max-width:540px; max-height:90vh; overflow-y:auto; }
.modal h3 { margin-bottom:16px; }
.modal .btn-row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }

.hidden { display:none !important; }

.request-item { padding:14px; border-radius:10px; background:#0f0f13; border:1px solid #2a2a3a; margin-bottom:8px; }
.request-item.done { opacity:0.5; }
.request-header { display:flex; justify-content:space-between; align-items:start; gap:12px; margin-bottom:8px; }
.request-title { font-weight:600; font-size:15px; }
.request-meta { font-size:12px; color:#888; margin-top:2px; }
.request-date { font-size:11px; color:#666; text-align:right; margin-bottom:6px; }
.request-badge { font-size:11px; padding:3px 8px; border-radius:10px; display:inline-block; }
.request-badge.pending { background:rgba(139,92,246,0.15); color:#a78bfa; }
.request-badge.done { background:rgba(34,197,94,0.15); color:#4ade80; }
.request-reason { font-size:13px; color:#aaa; padding:8px; background:#1a1a24; border-radius:6px; margin-bottom:10px; }

::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-thumb { background:#2a2a3a; border-radius:4px; }
</style>
</head>
<body>

<div class="container">
  <h1>牦牛音乐 · <span>管理后台</span></h1>

  <div class="tabs">
    <button class="tab active" id="tabSongs" onclick="switchTab('songs')">🎵 歌曲</button>
    <button class="tab" id="tabArtists" onclick="switchTab('artists')">🎤 歌手</button>
    <button class="tab" id="tabAlbums" onclick="switchTab('albums')">💿 专辑</button>
    <button class="tab" id="tabRequests" onclick="switchTab('requests')">📬 投稿</button>
  </div>

  <!-- ========== 歌曲 ========== -->
  <div id="panelSongs">
    <div class="card">
      <h3>➕ 上传新歌曲</h3>
      <div class="form-row">
        <div><label>MP3 文件（自动读歌名/专辑/歌手）</label><input type="file" class="file-input" id="mp3File" accept="audio/mpeg,audio/mp3"></div>
      </div>
      <div class="form-row">
        <div><label>歌名</label><input type="text" id="songTitle"></div>
      </div>

      <div class="form-row">
        <div>
          <label>歌手（可多选，顺序即显示顺序）</label>
          <div class="chip-list" id="selectedArtists"></div>
          <div class="chip-select" style="margin-top:8px;">
            <select id="artistPicker"></select>
            <button class="btn btn-ghost btn-sm" onclick="addSelectedArtist()">+ 添加</button>
            <button class="btn btn-ghost btn-sm" onclick="openNewArtist()">+ 新歌手</button>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div>
          <label>专辑</label>
          <div class="chip-select">
            <select id="albumPicker"></select>
            <button class="btn btn-ghost btn-sm" onclick="openNewAlbum()">+ 新专辑</button>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div><label>封面图（可选，无专辑封面时用）</label><input type="file" class="file-input" id="coverFile" accept="image/*"></div>
      </div>
      <div class="preview" id="coverPreview"></div>

      <div class="form-row">
        <div>
          <label>歌词（可选，粘贴框优先）</label>
          <input type="file" class="file-input" id="lyricsFile" accept=".lrc,.txt">
          <textarea class="file-input" id="lyricsText" placeholder="或直接粘贴 LRC 歌词" style="margin-top:8px;"></textarea>
        </div>
      </div>
      <button class="btn btn-primary" id="uploadBtn" onclick="uploadSong()" disabled>上传</button>
      <div class="status" id="uploadStatus"></div>
    </div>

    <div class="card">
      <h3>📋 歌曲列表</h3>
      <div id="songList">加载中...</div>
    </div>
  </div>

  <!-- ========== 歌手 ========== -->
  <div id="panelArtists" class="hidden">
    <div class="card">
      <h3>➕ 新建歌手</h3>
      <div class="form-row">
        <div><label>歌手名</label><input type="text" id="newArtistName"></div>
      </div>
      <div class="form-row">
        <div><label>歌手照片（可选）</label><input type="file" class="file-input" id="newArtistAvatar" accept="image/*"></div>
      </div>
      <div class="preview" id="newArtistPreview"></div>
      <div class="form-row">
        <div><label>简介（可选）</label><input type="text" id="newArtistBio"></div>
      </div>
      <button class="btn btn-primary" onclick="createArtistFromPanel()">创建歌手</button>
      <div class="status" id="artistCreateStatus"></div>
    </div>
    <div class="card">
      <h3>🎤 歌手列表</h3>
      <div id="artistList">加载中...</div>
    </div>
  </div>

  <!-- ========== 专辑 ========== -->
  <div id="panelAlbums" class="hidden">
    <div class="card">
      <h3>➕ 新建专辑</h3>
      <div class="form-row">
        <div><label>专辑名</label><input type="text" id="newAlbumName"></div>
        <div><label>所属歌手</label><select id="newAlbumArtist"></select></div>
      </div>
      <div class="form-row">
        <div><label>专辑封面（一张即可，专辑内歌曲共用）</label><input type="file" class="file-input" id="newAlbumCover" accept="image/*"></div>
      </div>
      <div class="preview" id="newAlbumPreview"></div>
      <button class="btn btn-primary" onclick="createAlbumFromPanel()">创建专辑</button>
      <div class="status" id="albumCreateStatus"></div>
    </div>
    <div class="card">
      <h3>💿 专辑列表</h3>
      <div id="albumList">加载中...</div>
    </div>
  </div>

  <!-- ========== 投稿 ========== -->
  <div id="panelRequests" class="hidden">
    <div class="card">
      <h3>📬 用户投稿</h3>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button class="btn btn-ghost btn-sm" onclick="filterRequests('all')" id="filterAll">全部</button>
        <button class="btn btn-ghost btn-sm" onclick="filterRequests('pending')" id="filterPending">待处理</button>
        <button class="btn btn-ghost btn-sm" onclick="filterRequests('done')" id="filterDone">已处理</button>
      </div>
      <div id="requestList">加载中...</div>
    </div>
  </div>
</div>

<!-- 编辑歌曲弹窗 -->
<div class="modal-overlay hidden" id="editModal">
  <div class="modal">
    <h3>编辑歌曲</h3>
    <input type="hidden" id="editId">
    <div class="form-row"><div><label>歌名</label><input type="text" id="editTitle"></div></div>
    <div class="form-row">
      <div>
        <label>歌手</label>
        <div class="chip-list" id="editSelectedArtists"></div>
        <div class="chip-select" style="margin-top:8px;">
          <select id="editArtistPicker"></select>
          <button class="btn btn-ghost btn-sm" onclick="addEditArtist()">+ 添加</button>
        </div>
      </div>
    </div>
    <div class="form-row">
      <div>
        <label>专辑</label>
        <select id="editAlbumPicker"></select>
      </div>
    </div>
    <div class="form-row"><div><label>更换封面图</label><input type="file" class="file-input" id="editCover" accept="image/*"></div></div>
    <div class="preview" id="editCoverPreview"></div>
    <div class="form-row"><div>
      <label>歌词</label>
      <input type="file" class="file-input" id="editLyrics" accept=".lrc,.txt">
      <textarea class="file-input" id="editLyricsText" placeholder="或直接粘贴 LRC 歌词" style="margin-top:8px;"></textarea>
    </div></div>
    <div class="status" id="editLyricsStatus"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeEdit()">取消</button>
      <button class="btn btn-primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<!-- 编辑歌手弹窗 -->
<div class="modal-overlay hidden" id="editArtistModal">
  <div class="modal">
    <h3>编辑歌手</h3>
    <input type="hidden" id="editArtistId">
    <div class="form-row">
      <div><label>歌手名</label><input type="text" id="editArtistNameInput"></div>
    </div>
    <div class="form-row">
      <div><label>更换歌手照片（可选）</label><input type="file" class="file-input" id="editArtistAvatar" accept="image/*"></div>
    </div>
    <div class="preview" id="editArtistPreview"></div>
    <div class="form-row">
      <div><label>简介（可选）</label><input type="text" id="editArtistBio"></div>
    </div>
    <div class="status" id="editArtistStatus"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeEditArtist()">取消</button>
      <button class="btn btn-primary" onclick="saveEditArtist()">保存</button>
    </div>
  </div>
</div>

<!-- 新建歌手弹窗（上传时用） -->
<div class="modal-overlay hidden" id="quickArtistModal">
  <div class="modal">
    <h3>新建歌手</h3>
    <div class="form-row"><div><label>歌手名</label><input type="text" id="quickArtistName"></div></div>
    <div class="form-row"><div><label>歌手照片（可选）</label><input type="file" class="file-input" id="quickArtistAvatar" accept="image/*"></div></div>
    <div class="preview" id="quickArtistPreview"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeQuickArtist()">取消</button>
      <button class="btn btn-primary" onclick="createQuickArtist()">创建</button>
    </div>
  </div>
</div>

<!-- 新建专辑弹窗（上传时用） -->
<div class="modal-overlay hidden" id="quickAlbumModal">
  <div class="modal">
    <h3>新建专辑</h3>
    <div class="form-row">
      <div><label>专辑名</label><input type="text" id="quickAlbumName"></div>
      <div><label>歌手</label><select id="quickAlbumArtist"></select></div>
    </div>
    <div class="form-row"><div><label>专辑封面</label><input type="file" class="file-input" id="quickAlbumCover" accept="image/*"></div></div>
    <div class="preview" id="quickAlbumPreview"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeQuickAlbum()">取消</button>
      <button class="btn btn-primary" onclick="createQuickAlbum()">创建</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
// ============================================================
// 牦牛音乐 · 后台 v3（含歌手编辑）
// ============================================================

let editingSong = null;
let editingArtists = [];
let selectedArtists = [];
let editingArtist = null;
let allArtists = [];
let allAlbums = [];
let allRequests = [];
let requestFilter = 'all';

function esc(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }

function switchTab(which) {
  ['songs','artists','albums','requests'].forEach(function(t) {
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === which);
  });
  document.getElementById('panelSongs').classList.toggle('hidden', which !== 'songs');
  document.getElementById('panelArtists').classList.toggle('hidden', which !== 'artists');
  document.getElementById('panelAlbums').classList.toggle('hidden', which !== 'albums');
  document.getElementById('panelRequests').classList.toggle('hidden', which !== 'requests');
  if (which === 'artists') loadArtists();
  if (which === 'albums') loadAlbums();
  if (which === 'requests') loadRequests();
}

// ---------- 加载歌手/专辑 ----------
async function loadArtistsAndAlbums() {
  const [a, b] = await Promise.all([
    supabaseClient.from('artists').select('*').order('name'),
    supabaseClient.from('albums').select('*').order('name'),
  ]);
  allArtists = a.data || [];
  allAlbums = b.data || [];
  refreshArtistPickers();
  refreshAlbumPickers();
}

function refreshArtistPickers() {
  const opts = '<option value="">-- 选择歌手 --</option>' +
    allArtists.map(function(a) { return `<option value="${a.id}">${esc(a.name)}</option>`; }).join('');
  ['artistPicker', 'editArtistPicker', 'newAlbumArtist', 'quickAlbumArtist'].forEach(function(id) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = opts;
  });
}

function refreshAlbumPickers() {
  const opts = '<option value="">-- 无专辑 --</option>' +
    allAlbums.map(function(a) {
      const artistName = a.artist_id ? (allArtists.find(function(x) { return x.id === a.artist_id; }) || {}).name || '' : '';
      return `<option value="${a.id}">${esc(a.name)}${artistName ? ' - ' + esc(artistName) : ''}</option>`;
    }).join('');
  ['albumPicker', 'editAlbumPicker'].forEach(function(id) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = opts;
  });
}

// ---------- 歌手选择器 ----------
function renderSelectedArtists() {
  const el = document.getElementById('selectedArtists');
  if (selectedArtists.length === 0) {
    el.innerHTML = '<span style="color:#555;font-size:13px;">尚未选择歌手</span>';
    return;
  }
  el.innerHTML = selectedArtists.map(function(a, i) {
    return `<span class="chip">${esc(a.name)}<button onclick="removeSelectedArtist(${i})">✕</button></span>`;
  }).join('');
  updateUploadBtn();
}

function addSelectedArtist() {
  const sel = document.getElementById('artistPicker');
  const id = parseInt(sel.value);
  if (!id) { alert('请选择歌手'); return; }
  if (selectedArtists.some(function(a) { return a.id === id; })) { alert('已添加'); return; }
  const artist = allArtists.find(function(a) { return a.id === id; });
  if (artist) selectedArtists.push({ id: artist.id, name: artist.name });
  sel.value = '';
  renderSelectedArtists();
}

function removeSelectedArtist(i) {
  selectedArtists.splice(i, 1);
  renderSelectedArtists();
}

// ---------- 上传歌曲 ----------
document.getElementById('mp3File').addEventListener('change', async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  jsmediatags.read(file, {
    onSuccess: function(tag) {
      const t = tag.tags;
      if (t.title) document.getElementById('songTitle').value = t.title;
      if (t.album) {
        const matched = allAlbums.find(function(a) { return a.name === t.album; });
        if (matched) document.getElementById('albumPicker').value = matched.id;
      }
      if (t.artist) {
        const names = t.artist.split(/[,、/&]/).map(function(s) { return s.trim(); }).filter(Boolean);
        selectedArtists = [];
        names.forEach(function(n) {
          const matched = allArtists.find(function(a) { return a.name === n; });
          if (matched) selectedArtists.push({ id: matched.id, name: matched.name });
        });
        renderSelectedArtists();
      }
      document.getElementById('uploadStatus').textContent = '已读取：' + (t.title || '') + ' - ' + (t.artist || '');
      updateUploadBtn();
    },
    onError: function() {
      document.getElementById('uploadStatus').textContent = '无法读取标签，请手动填写';
      updateUploadBtn();
    }
  });
});

document.getElementById('coverFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  document.getElementById('coverPreview').innerHTML = file ? '<img src="' + URL.createObjectURL(file) + '">' : '';
});

document.getElementById('songTitle').addEventListener('input', updateUploadBtn);

function updateUploadBtn() {
  const hasFile = document.getElementById('mp3File').files.length > 0;
  const hasTitle = document.getElementById('songTitle').value.trim() !== '';
  document.getElementById('uploadBtn').disabled = !(hasFile && hasTitle);
}

async function uploadSong() {
  const mp3File = document.getElementById('mp3File').files[0];
  const coverFile = document.getElementById('coverFile').files[0];
  const lyricsFile = document.getElementById('lyricsFile').files[0];
  const lyricsText = (document.getElementById('lyricsText').value || '').trim();
  const title = document.getElementById('songTitle').value.trim();
  const albumId = document.getElementById('albumPicker').value || null;
  const status = document.getElementById('uploadStatus');
  const btn = document.getElementById('uploadBtn');

  if (!mp3File || !title) { status.textContent = '请选择 MP3 并填歌名'; return; }
  btn.disabled = true;
  status.textContent = '上传中...';

  try {
    const ts = Date.now();

    const audioPath = ts + '_' + mp3File.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const { error: e1 } = await supabaseClient.storage.from('audio').upload(audioPath, mp3File);
    if (e1) throw new Error('MP3 上传失败：' + e1.message);
    const audioUrl = supabaseClient.storage.from('audio').getPublicUrl(audioPath).data.publicUrl;

    let coverUrl = null;
    if (coverFile) {
      const p = ts + '_' + coverFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const { error } = await supabaseClient.storage.from('covers').upload(p, coverFile);
      if (error) throw new Error('封面上传失败：' + error.message);
      coverUrl = supabaseClient.storage.from('covers').getPublicUrl(p).data.publicUrl;
    }

    let lyricsUrl = null;
    if (lyricsText) {
      const p = ts + '_lyrics.lrc';
      const blob = new Blob([lyricsText], { type: 'text/plain;charset=utf-8' });
      const { error } = await supabaseClient.storage.from('lyrics').upload(p, blob);
      if (error) throw new Error('歌词上传失败：' + error.message);
      lyricsUrl = supabaseClient.storage.from('lyrics').getPublicUrl(p).data.publicUrl;
    } else if (lyricsFile) {
      const p = ts + '_' + lyricsFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const { error } = await supabaseClient.storage.from('lyrics').upload(p, lyricsFile);
      if (error) throw new Error('歌词上传失败：' + error.message);
      lyricsUrl = supabaseClient.storage.from('lyrics').getPublicUrl(p).data.publicUrl;
    }

    const artistNames = selectedArtists.map(function(a) { return a.name; }).join(',');

    const { data: songRow, error: e2 } = await supabaseClient.from('songs').insert({
      title,
      artist: artistNames || null,
      album: null,
      album_id: albumId ? parseInt(albumId) : null,
      audio_url: audioUrl,
      cover_url: coverUrl,
      lyrics: lyricsUrl,
    }).select().single();
    if (e2) throw new Error('写库失败：' + e2.message);

    if (selectedArtists.length > 0) {
      const rels = selectedArtists.map(function(a, i) {
        return { song_id: songRow.id, artist_id: a.id, position: i };
      });
      const { error: e3 } = await supabaseClient.from('song_artists').insert(rels);
      if (e3) throw new Error('关联歌手失败：' + e3.message);
    }

    status.textContent = '✅ 上传成功！';
    ['mp3File','coverFile','lyricsFile','songTitle','lyricsText'].forEach(function(id) {
      const el = document.getElementById(id); if (el) el.value = '';
    });
    document.getElementById('albumPicker').value = '';
    document.getElementById('coverPreview').innerHTML = '';
    selectedArtists = [];
    renderSelectedArtists();

    loadSongs();
  } catch (err) {
    status.textContent = '❌ ' + err.message;
  } finally {
    btn.disabled = false;
    updateUploadBtn();
  }
}

async function loadSongs() {
  const el = document.getElementById('songList');
  el.textContent = '加载中...';

  const { data: songs, error } = await supabaseClient.from('songs').select('*').order('created_at', { ascending: false });
  if (error) { el.textContent = '加载失败：' + error.message; return; }
  if (!songs || songs.length === 0) { el.textContent = '还没有歌曲'; return; }

  const songIds = songs.map(function(s) { return s.id; });
  const { data: rels } = await supabaseClient.from('song_artists').select('song_id, artist_id, position').in('song_id', songIds);

  const relMap = {};
  (rels || []).forEach(function(r) {
    if (!relMap[r.song_id]) relMap[r.song_id] = [];
    relMap[r.song_id].push(r);
  });

  el.innerHTML = songs.map(function(s) {
    const relList = (relMap[s.id] || []).sort(function(a,b) { return a.position - b.position; });
    const artistNames = relList.map(function(r) {
      const a = allArtists.find(function(x) { return x.id === r.artist_id; });
      return a ? a.name : null;
    }).filter(Boolean).join(' / ');

    const album = s.album_id ? allAlbums.find(function(a) { return a.id === s.album_id; }) : null;
    const albumName = album ? album.name : (s.album || '无专辑');

    return `<div class="item-row">
      ${s.cover_url ? '<img class="item-cover" src="' + s.cover_url + '">' : '<div class="item-cover">🎵</div>'}
      <div class="item-info">
        <div class="item-title">${esc(s.title)}</div>
        <div class="item-meta">${esc(artistNames || s.artist || '未知歌手')} · ${esc(albumName)}${s.lyrics ? ' · 有歌词' : ''}</div>
      </div>
      <div class="item-actions">
        <button class="btn btn-primary btn-sm" onclick="openEdit(${s.id})">编辑</button>
        <button class="btn btn-danger btn-sm" onclick="deleteSong(${s.id})">删除</button>
      </div>
    </div>`;
  }).join('');
}

async function saveEdit() {
  const id = document.getElementById('editId').value;
  const title = document.getElementById('editTitle').value.trim();
  const albumId = document.getElementById('editAlbumPicker').value || null;
  const coverFile = document.getElementById('editCover').files[0];
  const lyricsFile = document.getElementById('editLyrics').files[0];
  const lyricsText = (document.getElementById('editLyricsText').value || '').trim();

  if (!title) { alert('歌名不能为空'); return; }

  try {
    let coverUrl = editingSong.cover_url;
    let lyricsUrl = editingSong.lyrics;
    const ts = Date.now();

    if (coverFile) {
      const p = ts + '_' + coverFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const { error } = await supabaseClient.storage.from('covers').upload(p, coverFile);
      if (error) throw new Error('封面上传失败：' + error.message);
      coverUrl = supabaseClient.storage.from('covers').getPublicUrl(p).data.publicUrl;
    }

    if (lyricsText) {
      const p = ts + '_lyrics.lrc';
      const blob = new Blob([lyricsText], { type: 'text/plain;charset=utf-8' });
      const { error } = await supabaseClient.storage.from('lyrics').upload(p, blob);
      if (error) throw new Error('歌词上传失败：' + error.message);
      lyricsUrl = supabaseClient.storage.from('lyrics').getPublicUrl(p).data.publicUrl;
    } else if (lyricsFile) {
      const p = ts + '_' + lyricsFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const { error } = await supabaseClient.storage.from('lyrics').upload(p, lyricsFile);
      if (error) throw new Error('歌词上传失败：' + error.message);
      lyricsUrl = supabaseClient.storage.from('lyrics').getPublicUrl(p).data.publicUrl;
    }

    const artistNames = editingArtists.map(function(a) { return a.name; }).join(',');

    const { error } = await supabaseClient.from('songs').update({
      title,
      artist: artistNames || null,
      album_id: albumId ? parseInt(albumId) : null,
      cover_url: coverUrl,
      lyrics: lyricsUrl,
    }).eq('id', id);
    if (error) throw new Error('更新失败：' + error.message);

    await supabaseClient.from('song_artists').delete().eq('song_id', id);
    if (editingArtists.length > 0) {
      const rels = editingArtists.map(function(a, i) {
        return { song_id: parseInt(id), artist_id: a.id, position: i };
      });
      await supabaseClient.from('song_artists').insert(rels);
    }

    closeEdit();
    loadSongs();
  } catch (err) {
    alert(err.message);
  }
}

async function loadRequests() {
  const el = document.getElementById('requestList');
  el.textContent = '加载中...';
  const { data, error } = await supabaseClient.from('song_requests').select('*').order('created_at', { ascending: false });
  if (error) { el.textContent = '加载失败：' + error.message; return; }
  allRequests = data || [];
  renderRequests();
}

function filterRequests(f) {
  requestFilter = f;
  ['all','pending','done'].forEach(function(x) {
    const el = document.getElementById('filter' + x.charAt(0).toUpperCase() + x.slice(1));
    if (el) {
      el.style.background = x === f ? '#8b5cf6' : '';
      el.style.color = x === f ? '#fff' : '';
    }
  });
  renderRequests();
}

function renderRequests() {
  const el = document.getElementById('requestList');
  let list = allRequests;
  if (requestFilter === 'pending') list = allRequests.filter(function(r) { return r.status !== 'done'; });
  if (requestFilter === 'done') list = allRequests.filter(function(r) { return r.status === 'done'; });

  if (list.length === 0) { el.innerHTML = '<div class="status">还没有投稿</div>'; return; }

  el.innerHTML = list.map(function(r) {
    const done = r.status === 'done';
    const date = new Date(r.created_at);
    const dateStr = date.getFullYear() + '-' + (date.getMonth()+1) + '-' + date.getDate() + ' ' + date.getHours() + ':' + ('0'+date.getMinutes()).slice(-2);
    return `<div class="request-item${done ? ' done' : ''}">
      <div class="request-header">
        <div style="flex:1;min-width:0;">
          <div class="request-title">${esc(r.song_title)}</div>
          <div class="request-meta">${esc(r.artist || '未填歌手')} · 投稿人：${esc(r.nickname || '匿名')}</div>
        </div>
        <div>
          <div class="request-date">${dateStr}</div>
          <span class="request-badge ${done ? 'done' : 'pending'}">${done ? '已处理' : '待处理'}</span>
        </div>
      </div>
      ${r.reason ? '<div class="request-reason">💬 ' + esc(r.reason) + '</div>' : ''}
      <div style="display:flex;gap:6px;">
        ${!done
          ? '<button class="btn btn-primary btn-sm" onclick="markRequest(' + r.id + ', \'done\')">标记已处理</button>'
          : '<button class="btn btn-ghost btn-sm" onclick="markRequest(' + r.id + ', \'pending\')">恢复待处理</button>'}
        <button class="btn btn-danger btn-sm" onclick="deleteRequest(' + r.id + ')">删除</button>
      </div>
    </div>`;
  }).join('');
}

async function markRequest(id, status) {
  await supabaseClient.from('song_requests').update({ status }).eq('id', id);
  loadRequests();
}

async function deleteRequest(id) {
  if (!confirm('删除这条投稿？')) return;
  await supabaseClient.from('song_requests').delete().eq('id', id);
  loadRequests();
}

// ---------- 启动 ----------
(async function() {
  await loadArtistsAndAlbums();
  renderSelectedArtists();
  loadSongs();
})();
</script>
</body>
