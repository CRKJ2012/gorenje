<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 牦牛音乐</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
      background: radial-gradient(circle at 20% 20%, rgba(139,92,246,0.15), transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(99,102,241,0.1), transparent 50%),
                  var(--bg);
    }
    .auth-box {
      width: 100%; max-width: 400px;
      background: var(--bg-soft);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px; padding: 36px 32px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    .auth-logo {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 8px;
    }
    .auth-logo-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; box-shadow: 0 8px 24px rgba(139,92,246,0.4);
    }
    .auth-logo-text { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .auth-logo-text span { color: var(--accent); }
    .auth-sub { text-align: center; color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }

    .tabs {
      display: flex; background: var(--bg-card); border-radius: 10px;
      padding: 4px; margin-bottom: 24px;
    }
    .tab {
      flex: 1; padding: 9px; border-radius: 7px; border: none;
      background: none; color: var(--text-dim); cursor: pointer;
      font-size: 14px; font-weight: 500; transition: all 0.15s;
    }
    .tab.active { background: var(--accent); color: #fff; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
    .hint { font-size: 11px; color: var(--text-faint); margin-top: 6px; }

    .msg {
      padding: 10px 12px; border-radius: 8px; font-size: 13px;
      margin-bottom: 14px; display: none;
    }
    .msg.error { background: rgba(239,68,68,0.12); color: #f87171; display: block; border: 1px solid rgba(239,68,68,0.2); }
    .msg.success { background: rgba(34,197,94,0.12); color: #4ade80; display: block; border: 1px solid rgba(34,197,94,0.2); }

    .auth-footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-faint); }
    .auth-footer a { color: var(--accent); cursor: pointer; }
  </style>
</head>
<body>

<div class="auth-box">
  <div class="auth-logo">
    <div class="auth-logo-icon">🎵</div>
    <div class="auth-logo-text">牦牛<span>音乐</span></div>
  </div>
  <div class="auth-sub">登录后同步你的歌单和收藏</div>

  <div class="tabs">
    <button class="tab active" id="tabLogin" onclick="switchTab('login')">登录</button>
    <button class="tab" id="tabRegister" onclick="switchTab('register')">注册</button>
  </div>

  <div id="msg" class="msg"></div>

  <!-- 登录表单 -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="field">
      <label>手机号</label>
      <input type="tel" class="input" id="loginPhone" placeholder="11 位手机号" maxlength="11" autocomplete="tel">
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" class="input" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">登录</button>
  </form>

  <!-- 注册表单 -->
  <form id="registerForm" onsubmit="handleRegister(event)" style="display:none;">
    <div class="field">
      <label>手机号</label>
      <input type="tel" class="input" id="regPhone" placeholder="11 位手机号" maxlength="11" autocomplete="tel">
    </div>
    <div class="field">
      <label>昵称（可选）</label>
      <input type="text" class="input" id="regNickname" placeholder="给自己起个名字" maxlength="20">
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" class="input" id="regPassword" placeholder="至少 6 位" autocomplete="new-password">
      <div class="hint">至少 6 位，必须同时包含数字和小写字母</div>
    </div>
    <div class="field">
      <label>确认密码</label>
      <input type="password" class="input" id="regPassword2" placeholder="再输一次" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;" id="regBtn">注册</button>
  </form>

  <div class="auth-footer">
    登录即代表同意我们的服务条款 · <a onclick="skipLogin()">暂不登录</a>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  // 如果已登录，直接跳首页
  (async function() {
    const session = await getSession();
    if (session) location.href = 'index.html';
  })();

  function switchTab(which) {
    document.getElementById('tabLogin').classList.toggle('active', which === 'login');
    document.getElementById('tabRegister').classList.toggle('active', which === 'register');
    document.getElementById('loginForm').style.display = which === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = which === 'register' ? 'block' : 'none';
    hideMsg();
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }
  function hideMsg() {
    document.getElementById('msg').className = 'msg';
  }

  async function handleLogin(e) {
    e.preventDefault();
    hideMsg();
    const phone = document.getElementById('loginPhone').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');

    if (!phone || !password) { showMsg('请填写手机号和密码', 'error'); return; }

    btn.disabled = true;
    btn.textContent = '登录中...';
    try {
      await signIn(phone, password);
      location.href = 'index.html';
    } catch (err) {
      showMsg(err.message, 'error');
      btn.disabled = false;
      btn.textContent = '登录';
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    hideMsg();
    const phone = document.getElementById('regPhone').value.trim();
    const nickname = document.getElementById('regNickname').value.trim();
    const password = document.getElementById('regPassword').value;
    const password2 = document.getElementById('regPassword2').value;
    const btn = document.getElementById('regBtn');

    if (!isValidPhone(phone)) { showMsg('请输入正确的 11 位手机号', 'error'); return; }
    const pwdErr = getPasswordError(password);
    if (pwdErr) { showMsg(pwdErr, 'error'); return; }
    if (password !== password2) { showMsg('两次密码不一致', 'error'); return; }

    btn.disabled = true;
    btn.textContent = '注册中...';
    try {
      const data = await signUp(phone, password, nickname);
      if (data.user && data.session) {
        // 自动登录成功
        location.href = 'index.html';
      } else {
        // 需要邮箱确认（Supabase 默认可能需要）
        showMsg('注册成功！请检查邮箱确认，或联系管理员关闭邮箱验证', 'success');
        btn.disabled = false;
        btn.textContent = '注册';
      }
    } catch (err) {
      showMsg(err.message, 'error');
      btn.disabled = false;
      btn.textContent = '注册';
    }
  }

  function skipLogin() {
    location.href = 'index.html';
  }
</script>

</body>
</html>
