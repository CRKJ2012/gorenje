<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>歌手 · 牦牛音乐</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .artist-hero {
      display: flex; align-items: flex-end; gap: 28px;
      padding: 40px 0; margin-bottom: 32px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .artist-hero-avatar {
      width: 180px; height: 180px; border-radius: 50%;
      overflow: hidden; flex-shrink: 0;
      background: linear-gradient(135deg, #2a2a35, #1a1a22);
      display: flex; align-items: center; justify-content: center;
      font-size: 72px; color: rgba(255,255,255,0.15);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .artist-hero-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .artist-hero-info { flex: 1; min-width: 0; }
    .artist-hero-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .artist-hero-name { font-size: 56px; font-weight: 800; letter-spacing: -2px; margin-bottom: 16px; line-height: 1; }
    .artist-hero-meta { font-size: 14px; color: var(--text-dim); }
    .artist-hero-meta b { color: var(--text); }

    @media (max-width: 700px) {
      .artist-hero { flex-direction: column; align-items: center; text-align: center; padding: 24px 0; gap: 20px; }
      .artist-hero-avatar { width: 140px; height: 140px; font-size: 56px; }
      .artist-hero-name { font-size: 36px; }
    }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">🎵</div>
      <div class="brand-name">牦牛<span>音乐</span></div>
    </div>
    <div class="nav-section">
      <div class="nav-label">返回</div>
      <button class="nav-item" onclick="location.href='index.html'">
        <span class="icon">←</span><span>回到首页</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-toggle" onclick="location.href='index.html'">←</button>
      <div class="page-title">歌手详情</div>
    </div>
    <div class="content" id="content">
      <div class="empty"><div class="empty-text">加载中...</div></div>
    </div>
  </main>
</div>

<audio id="audio"></audio>

<script src="config.js"></script>
<script>
  const audio = document.getElementById('audio');
  const content = document.getElementById('content');
  const params = new URLSearchParams(location.search);
  const artistName = params.get('name') || '';

  let viewSongs = [];
  let currentIndex = 0;
  let isPlaying = false;

  function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = t == null ? '' : t;
    return d.innerHTML;
  }
  function getInitial(name) {
    if (!name) return '?';
    return name.trim().charAt(0).toUpperCase();
  }
  function formatTime(s) {
    if (isNaN(s) || !isFinite(s)) return '0:00';
    return Math.floor(s/60) + ':' + ('0' + Math.floor(s%60)).slice(-2);
  }

  async function loadArtist() {
    if (!artistName) {
      content.innerHTML = '<div class="empty"><div class="empty-text">未指定歌手</div></div>';
      return;
    }

    const { data, error } = await supabaseClient
      .from('songs').select('*').eq('artist', artistName).order('created_at', { ascending: true });

    if (error) {
      content.innerHTML = '<div class="empty"><div class="empty-text">加载失败</div></div>';
      return;
    }

    viewSongs = data || [];

    let cover = null;
    viewSongs.forEach(function(s) { if (!cover && s.cover_url) cover = s.cover_url; });

    const avatarHtml = cover
      ? '<img src="' + cover + '">'
      : getInitial(artistName);

    content.innerHTML = `
      <div class="artist-hero">
        <div class="artist-hero-avatar">${avatarHtml}</div>
        <div class="artist-hero-info">
          <div class="artist-hero-label">歌手</div>
          <div class="artist-hero-name">${escapeHtml(artistName)}</div>
          <div class="artist-hero-meta">共 <b>${viewSongs.length}</b> 首歌曲</div>
        </div>
      </div>
      <div class="song-list" id="songList"></div>
    `;

    renderList();
  }

  function renderList() {
    const listEl = document.getElementById('songList');
    if (viewSongs.length === 0) {
      listEl.innerHTML = '<div class="empty"><div class="empty-text">这位歌手还没有歌曲</div></div>';
      return;
    }

    listEl.innerHTML = viewSongs.map(function(song, i) {
      const active = isPlaying && i === currentIndex;
      const coverHtml = song.cover_url
        ? '<img src="' + song.cover_url + '">'
        : '🎵';
      return `
        <div class="song-row${active ? ' active' : ''}" onclick="playIndex(${i})">
          <div class="row-index">${i + 1}</div>
          <div class="row-cover">${coverHtml}</div>
          <div class="row-info">
            <div class="row-title">${escapeHtml(song.title)}</div>
            <div class="row-meta">${escapeHtml(song.album || '无专辑')}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  function playIndex(i) {
    if (i < 0 || i >= viewSongs.length) return;
    if (i === currentIndex && audio.src && !audio.paused) {
      audio.pause();
      return;
    }
    currentIndex = i;
    audio.src = viewSongs[i].audio_url;
    audio.play().catch(function(){});
    renderList();
  }

  audio.addEventListener('play', function() { isPlaying = true; renderList(); });
  audio.addEventListener('pause', function() { isPlaying = false; renderList(); });
  audio.addEventListener('ended', function() {
    playIndex((currentIndex + 1) % viewSongs.length);
  });

  loadArtist();
</script>

</body>
</html>
