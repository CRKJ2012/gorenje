<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>超人游戏 v1.3.0</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #111; color: #eee;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }

  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    overflow-y: auto;
    padding: 16px;
  }
  .screen.hidden { display: none !important; }

  .container { width: 100%; max-width: 720px; margin: 0 auto; }

  h1 { font-size: 20px; margin: 0 0 16px; text-align: center; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; padding: 12px; background: #2c2c2e;
    border: 1px solid #3a3a3c; border-radius: 10px;
    color: #fff; font-size: 16px;
  }
  .field input:focus, .field select:focus { outline: none; border-color: #0a84ff; }
  .btn {
    display: block; width: 100%; padding: 14px;
    background: #0a84ff; color: #fff; border: none;
    border-radius: 10px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-bottom: 12px;
  }
  .btn:active { opacity: .7; }
  .btn.secondary { background: #2c2c2e; }
  .btn:disabled { background: #333; color: #666; }
  .switch { text-align: center; font-size: 14px; color: #0a84ff; cursor: pointer; margin-top: 8px; }
  .status { font-size: 13px; text-align: center; margin-top: 12px; min-height: 20px; }
  .status.ok { color: #30d158; }
  .status.err { color: #ff453a; }
  .hidden { display: none !important; }

  .code-display {
    background: #2c2c2e; border-radius: 10px;
    padding: 20px; text-align: center; margin-bottom: 12px;
  }
  .code-display .code {
    font-size: 36px; font-weight: 700; letter-spacing: 8px;
    color: #0a84ff; font-family: monospace;
  }
  .code-display .label { font-size: 13px; color: #888; margin-bottom: 8px; }
  .divider { text-align: center; color: #555; font-size: 13px; margin: 20px 0; }
  .version { text-align: center; color: #555; font-size: 12px; padding: 24px 0 12px; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; background: #1c1c1e;
    border-bottom: 1px solid #2c2c2e;
    flex-shrink: 0;
  }
  .topbar.hidden { display: none !important; }
  .topbar .user-info { display: flex; align-items: center; gap: 10px; }
  .topbar .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #0a84ff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px;
  }
  .topbar .nickname { font-size: 15px; font-weight: 600; }
  .topbar .account { font-size: 12px; color: #888; }
  .topbar .icons { display: flex; gap: 12px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: #2c2c2e; border: none; color: #eee;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; position: relative;
  }
  .icon-btn:active { opacity: .7; }
  .icon-btn .badge {
    position: absolute; top: -4px; right: -4px;
    background: #ff453a; color: #fff; font-size: 10px;
    border-radius: 10px; padding: 1px 5px; min-width: 16px;
  }

  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 320px; max-width: 85vw;
    background: #1c1c1e; z-index: 101;
    transform: translateX(100%); transition: transform .25s ease;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header {
    padding: 16px; border-bottom: 1px solid #2c2c2e;
    display: flex; justify-content: space-between; align-items: center;
  }
  .drawer-header h2 { margin: 0; font-size: 17px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
  .drawer-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .drawer-tab {
    flex: 1; padding: 8px; text-align: center; font-size: 13px;
    background: #2c2c2e; border-radius: 8px; cursor: pointer;
  }
  .drawer-tab.active { background: #0a84ff; }

  .friend-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; background: #2c2c2e; border-radius: 10px;
    margin-bottom: 8px;
  }
  .friend-item .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #0a84ff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  .friend-item .info { flex: 1; min-width: 0; }
  .friend-item .name { font-size: 14px; font-weight: 600; }
  .friend-item .sub { font-size: 12px; color: #888; }
  .friend-item .actions { display: flex; gap: 6px; }
  .mini-btn {
    padding: 6px 10px; font-size: 12px; border-radius: 6px;
    border: none; cursor: pointer; background: #0a84ff; color: #fff;
  }
  .mini-btn.secondary { background: #3a3a3c; }
  .mini-btn:active { opacity: .7; }

  .setting-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid #2c2c2e;
  }
  .setting-row .label { font-size: 15px; }
  .toggle {
    width: 50px; height: 28px; border-radius: 14px;
    background: #3a3a3c; position: relative; cursor: pointer;
    transition: background .2s;
  }
  .toggle.on { background: #30d158; }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff; transition: transform .2s;
  }
  .toggle.on::after { transform: translateX(22px); }

  .invite-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .invite-modal .box {
    background: #1c1c1e; border-radius: 16px; padding: 24px;
    width: 100%; max-width: 340px; text-align: center;
    border: 1px solid #2c2c2e;
  }
  .invite-modal .box h3 { margin: 0 0 8px; font-size: 18px; }
  .invite-modal .box p { color: #888; font-size: 14px; margin: 0 0 20px; }

  /* 选人页 */
  #view-select .char-scroll {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    margin: 12px 0;
    padding: 8px 0;
  }
  #view-select .char-scroll::-webkit-scrollbar { display: none; }
  .char-grid {
    display: flex;
    gap: 12px;
    padding: 0 16px;
    width: max-content;
  }
  .char-card {
    width: 140px;
    flex-shrink: 0;
    background: #2c2c2e; border-radius: 12px;
    padding: 12px; text-align: center;
    border: 3px solid transparent;
    cursor: pointer; transition: border-color .15s, transform .1s;
    position: relative;
  }
  .char-card:active { transform: scale(.97); }
  .char-card.selected { border-color: #0a84ff; }
  .char-card .portrait {
    width: 100%; aspect-ratio: 1;
    border-radius: 8px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 700; color: #fff;
    background: #3a3a3c;
    overflow: hidden;
  }
  .char-card .portrait img { width: 100%; height: 100%; object-fit: contain; }
  .char-card .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .char-card .stats { font-size: 11px; color: #888; line-height: 1.5; }
  .char-card .order-badge {
    position: absolute; top: -8px; right: -8px;
    background: #0a84ff; color: #fff;
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    z-index: 2;
  }
  .picked-info {
    text-align: center; font-size: 14px; color: #888;
    margin-bottom: 16px; min-height: 20px;
  }

  /* ========== 战斗页（俯视角） ========== */
  #view-game {
    position: fixed; inset: 0;
    background-color: #1a1a2e;
    background-image: url('assets/bg/bg_battle.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex; flex-direction: column;
    z-index: 100;
    overflow: hidden;
  }
  #view-game.hidden { display: none !important; }

  .battle-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; gap: 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
    z-index: 5;
    flex-shrink: 0;
  }
  .battle-side { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .battle-side.right { align-items: flex-end; }
  .battle-hp-row { width: 100%; max-width: 280px; }
  .battle-hp-row.right { display: flex; flex-direction: column; align-items: flex-end; }
  .battle-hp-name {
    font-size: 12px; color: #fff; margin-bottom: 2px;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
  }
  .battle-hp-bar {
    width: 100%; height: 14px; background: rgba(0,0,0,.5);
    border-radius: 7px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.2);
  }
  .battle-hp-fill {
    height: 100%; background: #30d158; transition: width .2s;
  }
  .battle-hp-row.right .battle-hp-bar { direction: rtl; }
  .battle-hp-row.right .battle-hp-fill { background: #0a84ff; }
  .battle-hp-row.dead { opacity: .3; }

  .battle-timer {
    font-size: 24px; font-weight: 700; color: #fff;
    font-family: monospace;
    text-shadow: 0 2px 4px rgba(0,0,0,.8);
    min-width: 70px; text-align: center;
  }

  .battle-arena {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: rgba(0,0,0,.15);
  }

  .fighter {
    position: absolute;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: left .05s linear, top .05s linear;
    z-index: 2;
  }
  .fighter .sprite {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  .fighter img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.6));
    pointer-events: none;
  }
  .fighter .placeholder {
    width: 60px; height: 60px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #fff;
    border-radius: 50%;
  }
  .fighter.hit-flash { animation: hitFlash .25s; }
  @keyframes hitFlash {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(2) drop-shadow(0 0 12px red); }
  }
  .fighter-name {
    position: absolute;
    top: -18px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px; color: #fff;
    background: rgba(0,0,0,.6);
    padding: 2px 8px; border-radius: 8px;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
  }

  .effect-layer {
    position: absolute; inset: 0; pointer-events: none;
    z-index: 3;
  }
  .skill-effect {
    position: absolute;
    pointer-events: none;
    transform-origin: center center;
    animation: skillFly .5s ease-out forwards;
  }
  .skill-effect img {
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  @keyframes skillFly {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.4) rotate(0deg); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.8) rotate(20deg); }
  }

  .battle-bottom {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 12px 16px 16px;
    background: linear-gradient(to top, rgba(0,0,0,.6), transparent);
    flex-shrink: 0;
    position: relative;
    min-height: 150px;
    z-index: 5;
  }

  .joystick {
    width: 110px; height: 110px;
    border-radius: 50%;
    background: rgba(255,255,255,.1);
    border: 2px solid rgba(255,255,255,.3);
    position: relative;
    touch-action: none;
    user-select: none;
  }
  .joystick-knob {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,.55);
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    transition: transform .05s;
    pointer-events: none;
  }

  .skill-arc {
    position: relative;
    width: 200px; height: 150px;
  }
  .skill-btn {
    position: absolute;
    border-radius: 50%;
    background: rgba(10,132,255,.85);
    color: #fff;
    border: 2px solid rgba(255,255,255,.4);
    font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    user-select: none;
    touch-action: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
    overflow: hidden;
  }
  .skill-btn:active { opacity: .7; }
  .skill-btn.disabled { background: rgba(80,80,80,.7); }
  .skill-btn .cd-overlay {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.65);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700;
    color: #fff;
  }

  .skill-btn.attack {
    width: 70px; height: 70px;
    right: 0; bottom: 0;
    background: rgba(48,209,88,.85);
    font-size: 14px;
  }
  .skill-btn.skill {
    width: 60px; height: 60px;
    right: 64px; bottom: 26px;
    background: rgba(255,159,10,.85);
  }
  .skill-btn.heal {
    width: 56px; height: 56px;
    right: 106px; bottom: 66px;
    background: rgba(255,69,58,.85);
  }
  .skill-btn.ultimate {
    width: 64px; height: 64px;
    right: 116px; bottom: -6px;
    background: rgba(191,90,242,.9);
    font-size: 12px;
  }

  .battle-toast {
    position: fixed; top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,.85);
    color: #fff; padding: 14px 28px;
    border-radius: 12px; font-size: 20px; font-weight: 700;
    z-index: 300; pointer-events: none;
    animation: toastIn .3s;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, -80%); }
    to { opacity: 1; transform: translate(-50%, -50%); }
  }

  .keyboard-hint {
    position: fixed; top: 8px; left: 8px;
    color: #888; font-size: 11px; z-index: 20;
    pointer-events: none;
    background: rgba(0,0,0,.4);
    padding: 4px 8px; border-radius: 6px;
  }

  /* 强制横屏遮罩 */
  #rotate-overlay {
    position: fixed; inset: 0;
    background: #0a0a0f;
    z-index: 9999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    padding: 40px;
  }
  #rotate-overlay .icon {
    font-size: 72px;
    margin-bottom: 24px;
    animation: rotateHint 2s ease-in-out infinite;
  }
  @keyframes rotateHint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }
  #rotate-overlay .text {
    font-size: 18px;
    color: #aaa;
  }
  #rotate-overlay .sub {
    font-size: 13px;
    color: #666;
    margin-top: 8px;
  }

  /* 竖屏时显示遮罩（只在战斗页） */
  @media (orientation: portrait) {
    body.in-battle #rotate-overlay {
      display: flex;
    }
  }
</style>
</head>
<body>

<!-- 强制横屏遮罩 -->
<div id="rotate-overlay">
  <div class="icon">📱</div>
  <div class="text">请横屏使用</div>
  <div class="sub">横过来才能开始战斗</div>
</div>

<div class="topbar hidden" id="topbar">
  <div class="user-info">
    <div class="avatar" id="topbar-avatar">?</div>
    <div>
      <div class="nickname" id="topbar-nickname">未登录</div>
      <div class="account" id="topbar-account">@-</div>
    </div>
  </div>
  <div class="icons">
    <button class="icon-btn" id="btn-open-friends" title="好友">
      👥<span class="badge hidden" id="friend-badge">0</span>
    </button>
    <button class="icon-btn" id="btn-open-settings" title="设置">⚙️</button>
  </div>
</div>

<div class="screen hidden" id="view-login">
  <div class="container">
    <h1>登录</h1>
    <div class="field">
      <label>账号ID（纯数字）</label>
      <input id="login-account" inputmode="numeric" autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="login-password" type="password" autocomplete="current-password">
    </div>
    <button class="btn" id="btn-login">登录</button>
    <div class="switch" id="to-register">没有账号？去注册</div>
    <div class="status" id="login-status"></div>
  </div>
</div>

<div class="screen hidden" id="view-register">
  <div class="container">
    <h1>注册</h1>
    <div class="field">
      <label>账号ID（纯数字，唯一）</label>
      <input id="reg-account" inputmode="numeric" autocomplete="off">
    </div>
    <div class="field">
      <label>游戏昵称（唯一）</label>
      <input id="reg-nickname" autocomplete="off">
    </div>
    <div class="field">
      <label>密码（至少6位）</label>
      <input id="reg-password" type="password" autocomplete="new-password">
    </div>
    <div class="field">
      <label>性别</label>
      <select id="reg-gender">
        <option value="male">男</option>
        <option value="female">女</option>
        <option value="other">其他</option>
      </select>
    </div>
    <button class="btn" id="btn-register">注册</button>
    <div class="switch" id="to-login">已有账号？去登录</div>
    <div class="status" id="register-status"></div>
  </div>
</div>

<div class="screen hidden" id="view-home">
  <div class="container">
    <h1>大厅</h1>
    <button class="btn" id="btn-create-room">创建房间</button>
    <div class="divider">或者</div>
    <input id="input-code" placeholder="输入6位分享码" maxlength="6" autocomplete="off"
           style="width:100%; padding:14px; background:#2c2c2e; border:1px solid #3a3a3c; border-radius:10px; color:#fff; font-size:18px; text-align:center; letter-spacing:4px; margin-bottom:12px; font-family:monospace;">
    <button class="btn secondary" id="btn-join">加入房间</button>
    <div class="version">v1.3.0</div>
  </div>
</div>

<div class="screen hidden" id="view-host">
  <div class="container">
    <h1>等待加入</h1>
    <div class="code-display">
      <div class="label">分享码（发给同学）</div>
      <div class="code" id="display-code">------</div>
    </div>
    <button class="btn" id="btn-copy">复制分享码</button>
    <div class="status" id="host-status">等待对方加入...</div>
    <button class="btn secondary" id="btn-invite-friend">邀请好友</button>
    <button class="btn secondary" id="btn-cancel-host" style="margin-top:4px;">取消</button>
  </div>
</div>

<div class="screen hidden" id="view-select">
  <div class="container">
    <h1>选择角色</h1>
    <div class="status" id="select-status">请选择 2 个角色</div>
    <div class="char-scroll">
      <div class="char-grid" id="char-grid"></div>
    </div>
    <div class="picked-info" id="picked-info"></div>
    <button class="btn" id="btn-confirm-select" disabled>确认出战</button>
  </div>
</div>

<div id="view-game" class="hidden">
  <div class="keyboard-hint">键盘：WASD 移动　J 普攻　K 技能　L 回血　U 必杀</div>
  <div class="battle-top">
    <div class="battle-side left" id="battle-side-left"></div>
    <div class="battle-timer" id="battle-timer">01:00</div>
    <div class="battle-side right" id="battle-side-right"></div>
  </div>
  <div class="battle-arena" id="battle-arena">
    <div class="effect-layer" id="effect-layer"></div>
    <div class="fighter" id="fighter-left"></div>
    <div class="fighter" id="fighter-right"></div>
  </div>
  <div class="battle-bottom">
    <div class="joystick" id="joystick">
      <div class="joystick-knob" id="joystick-knob"></div>
    </div>
    <div class="skill-arc">
      <div class="skill-btn attack" id="btn-attack">普攻</div>
      <div class="skill-btn skill" id="btn-skill">技能</div>
      <div class="skill-btn heal" id="btn-heal">回血</div>
      <div class="skill-btn ultimate" id="btn-ultimate">必杀</div>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="friends-overlay"></div>
<div class="drawer" id="friends-drawer">
  <div class="drawer-header">

const audio = {};
function initAudio() {
  for (const [key, path] of Object.entries(AUDIO_PATHS)) {
    const a = new Audio(path);
    a.preload = 'auto';
    if (key.startsWith('bgm')) { a.loop = true; a.volume = 0.5; }
    else { a.volume = 0.7; }
    a.addEventListener('error', () => {});
    audio[key] = a;
  }
}

let currentBgm = null;
let audioUnlocked = false;

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  if (currentBgm && settings.bgm) currentBgm.play().catch(() => {});
}
function playBgm(key) {
  if (currentBgm) { currentBgm.pause(); currentBgm.currentTime = 0; }
  currentBgm = audio[key] || null;
  if (currentBgm && settings.bgm && audioUnlocked) currentBgm.play().catch(() => {});
}
function stopBgm() {
  if (currentBgm) { currentBgm.pause(); currentBgm.currentTime = 0; currentBgm = null; }
}
function playSfx(key) {
  if (!settings.sfx || !audioUnlocked) return;
  const a = audio[key];
  if (!a) return;
  try { a.currentTime = 0; a.play().catch(() => {}); } catch {}
}

async function hashPassword(password, salt) {
  const data = new TextEncoder().encode(password + '::' + salt);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function setStatus(el, msg, type = '') {
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}
function generateCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function initial(name) { return name ? name.slice(0, 1).toUpperCase() : '?'; }

  } finally {
    btn.disabled = false;
  }

async function loginWith(accountId, password) {
  const passwordHash = await hashPassword(password, accountId);
  const { data, error } = await supabase
    .from('players')
    .select('id, account_id, nickname, gender, avatar_url, password_hash')
    .eq('account_id', accountId)
    .maybeSingle();

  if (error) throw error;
  if (!data) throw new Error('账号不存在');
  if (data.password_hash !== passwordHash) throw new Error('密码错误');

  await supabase.from('players').update({ last_login: new Date().toISOString() }).eq('id', data.id);
  currentPlayer = data;
  sessionStorage.setItem('player', JSON.stringify(data));

  showView('home');
  subscribeFriends();
  subscribeInvites();
  loadFriendBadge();
}

async function joinRoomByCode(code) {
  const { data, error } = await supabase
    .from('rooms')
    .select()
    .eq('share_code', code)
    .eq('status', 'waiting')
    .is('guest_id', null)
    .maybeSingle();
  if (error) throw error;
  if (!data) throw new Error('房间不存在或已满');

  const { error: updateError } = await supabase
    .from('rooms')
    .update({ guest_id: currentPlayer.id, status: 'playing' })
    .eq('id', data.id)
    .is('guest_id', null);
  if (updateError) throw updateError;

  currentRoom = { ...data, guest_id: currentPlayer.id, status: 'playing' };
  subscribeRoom(code);
  enterSelectPage();
}

  realtimeChannel = supabase
    .channel('room_' + code)
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `share_code=eq.${code}` },
      (payload) => {
        const room = payload.new;
        currentRoom = room;
        if (room.status === 'playing' && room.guest_id) {
          enterSelectPage();
        }
      }
    )
    .subscribe((status) => console.log('Room Realtime:', status));

function renderCharGrid() {
  const grid = document.getElementById('char-grid');
  grid.innerHTML = '';
  Object.values(CHARACTERS).forEach(c => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.dataset.id = c.id;
    const order = myPicked.indexOf(c.id);
    if (order >= 0) card.classList.add('selected');
    const portraitHTML = `
      <div class="portrait" style="background:${c.color}20;">
        <img src="${c.img}" alt="${c.name}"
             onerror="this.style.display='none'; this.parentElement.textContent='${c.name[0]}'; this.parentElement.style.background='${c.color}';">
      </div>
    `;
    card.innerHTML = `
      ${order >= 0 ? `<div class="order-badge">${order + 1}</div>` : ''}
      ${portraitHTML}
      <div class="name">${c.name}</div>
      <div class="stats">血量 ${c.hp} · 速度 ${c.speed}<br>普攻 ${c.attack}</div>
    `;
    card.onclick = () => togglePick(c.id);
    grid.appendChild(card);
  });
}

function togglePick(id) {
  const idx = myPicked.indexOf(id);
  if (idx >= 0) myPicked.splice(idx, 1);
  else {
    if (myPicked.length >= 2) { alert('最多选2个角色'); return; }
    myPicked.push(id);
  }
  renderCharGrid();
  updateSelectUI();
}

  const statusEl = document.getElementById('select-status');
  const infoEl = document.getElementById('picked-info');
  const btn = document.getElementById('btn-confirm-select');

    setStatus(statusEl, '请选择 2 个角色');
    infoEl.textContent = '';

  } else if (myPicked.length === 1) {
    setStatus(statusEl, '再选 1 个');
    infoEl.textContent = `第1位：${CHARACTERS[myPicked[0]].name}`;

    setStatus(statusEl, '选好了，点确认出战', 'ok');
    infoEl.innerHTML = `第1位：${CHARACTERS[myPicked[0]].name} &nbsp;|&nbsp; 第2位：${CHARACTERS[myPicked[1]].name}`;
    btn.disabled = false;
  }
}

  const btn = document.getElementById('btn-confirm-select');
  btn.disabled = true;
  setStatus(document.getElementById('select-status'), '已确认，等待对方...', 'ok');

  const isHost = currentRoom.host_id === currentPlayer.id;
  const updateField = isHost
    ? { host_picks: myPicked, host_ready: true }
    : { guest_picks: myPicked, guest_ready: true };

  const { error } = await supabase.from('rooms').update(updateField).eq('id', currentRoom.id);
  if (error) { alert('确认失败：' + error.message); btn.disabled = false; return; }
  checkBothReady();

function subscribeSelect() {
  if (selectChannel) supabase.removeChannel(selectChannel);
  selectChannel = supabase
    .channel('select_' + currentRoom.id)
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${currentRoom.id}` },
      (payload) => {
        currentRoom = payload.new;
        checkBothReady();
      }
    )
    .subscribe();
}

function checkBothReady() {
  const room = currentRoom;
  if (room.host_ready && room.guest_ready && room.host_picks && room.guest_picks) {
    if (battleChannel) return;
    if (room.host_id === currentPlayer.id) {
      initBattleChannel(room, true);
    } else {
      initBattleChannel(room, false);
    }
  }
}

// ============================================================
//                   战 斗 系 统（俯视角）
// ============================================================

const battle = {
  active: false,
  isHost: false,
  myPicks: [],
  oppPicks: [],
  myIndex: 0,
  oppIndex: 0,
  myHp: 0,
  oppHp: 0,
  myMaxHp: 0,
  oppMaxHp: 0,
  myCd: { skill: 0, heal: 0, ultimate: 0 },
  myX: 0.2, myY: 0.5,
  oppX: 0.8, oppY: 0.5,
  myStunned: 0,
  timer: 60,
  timerInterval: null,
  tickInterval: null,
  joyDX: 0, joyDY: 0,
  keyW: false, keyA: false, keyS: false, keyD: false
};

function initBattleChannel(room, isHost) {
  battle.isHost = isHost;

  if (battleChannel) supabase.removeChannel(battleChannel);
  battleChannel = supabase.channel('battle_' + room.id);

  battleChannel
    .on('broadcast', { event: 'start' }, () => {
      startBattle(room);
    })
    .on('broadcast', { event: 'state' }, ({ payload }) => {
      if (payload.from === currentPlayer.id) return;
      battle.oppX = payload.x;
      battle.oppY = payload.y;
      battle.oppIndex = payload.index;
      battle.oppHp = payload.hp;
      updateOpponentDisplay();
    })
    .on('broadcast', { event: 'hit' }, ({ payload }) => {
      if (payload.to !== currentPlayer.id) return;
      applyDamageToMe(payload.damage, payload.effect);
    })
    .on('broadcast', { event: 'swap' }, ({ payload }) => {
      if (payload.from === currentPlayer.id) return;
      battle.oppIndex = payload.index;
      battle.oppHp = CHARACTERS[battle.oppPicks[battle.oppIndex]].hp;
      updateOpponentDisplay();
    })
    .on('broadcast', { event: 'end' }, ({ payload }) => {
      if (payload.from === currentPlayer.id) return;
      endBattle(payload.reason, true);
    })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED' && isHost) {
        setTimeout(() => {
          battleChannel.send({
            type: 'broadcast',
            event: 'start',
            payload: { from: currentPlayer.id }
          });
          startBattle(room);
        }, 300);
      }
    });
}

function startBattle(room) {
  if (battle.active) return;
  battle.active = true;
  battle.myPicks = battle.isHost ? room.host_picks : room.guest_picks;
  battle.oppPicks = battle.isHost ? room.guest_picks : room.host_picks;

  battle.myIndex = 0;
  battle.oppIndex = 0;
  battle.myMaxHp = CHARACTERS[battle.myPicks[0]].hp;
  battle.oppMaxHp = CHARACTERS[battle.oppPicks[0]].hp;
  battle.myHp = battle.myMaxHp;
  battle.oppHp = battle.oppMaxHp;
  battle.myCd = { skill: 0, heal: 0, ultimate: 0 };
  battle.myX = 0.2;
  battle.myY = 0.5;
  battle.oppX = 0.8;
  battle.oppY = 0.5;
  battle.myStunned = 0;
  battle.timer = 60;

  renderBattleUI();
  showView('game');
  playBgm('bgmBattle');

  if (battle.tickInterval) clearInterval(battle.tickInterval);
  battle.tickInterval = setInterval(battleTick, 100);

  if (battle.timerInterval) clearInterval(battle.timerInterval);
  battle.timerInterval = setInterval(() => {
    if (!battle.active) return;
    battle.timer--;
    updateTimer();
    if (battle.timer <= 0) endBattle('timeout');
  }, 1000);

  setTimeout(() => showToast('战斗开始！'), 300);
}

function renderBattleUI() {
  renderHpSide('battle-side-left', battle.oppPicks, battle.oppIndex, battle.oppHp, battle.oppMaxHp, 'right');
  renderHpSide('battle-side-right', battle.myPicks, battle.myIndex, battle.myHp, battle.myMaxHp, 'left');
  renderFighter('fighter-left', battle.oppPicks[battle.oppIndex], true);
  renderFighter('fighter-right', battle.myPicks[battle.myIndex], false);
  requestAnimationFrame(() => updateFighterPositions());
  updateTimer();
  updateCooldownUI();
}

function renderHpSide(containerId, picks, activeIdx, activeHp, activeMaxHp, side) {
  const el = document.getElementById(containerId);
  el.innerHTML = picks.map((id, i) => {
    const c = CHARACTERS[id];
    const isActive = i === activeIdx;
    const hp = isActive ? activeHp : c.hp;
    const maxHp = isActive ? activeMaxHp : c.hp;
    const pct = Math.max(0, hp / maxHp * 100);
    const dead = hp <= 0 && !isActive ? ' dead' : '';
    return `
      <div class="battle-hp-row ${side === 'right' ? 'right' : ''}${dead}">
        <div class="battle-hp-name">${c.name}${isActive ? ' ⚔' : ''}</div>
        <div class="battle-hp-bar">
          <div class="battle-hp-fill" style="width:${pct}%"></div>
        </div>
      </div>
    `;
  }).join('');
}

function renderFighter(containerId, charId, isOpponent) {
  const el = document.getElementById(containerId);
  const c = CHARACTERS[charId];
  el.innerHTML = `
    <div class="sprite">
      <img src="${c.img}" alt="${c.name}"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="placeholder" style="display:none; background:${c.color};">${c.name[0]}</div>
    </div>
    <div class="fighter-name">${c.name}</div>
  `;
}

function updateFighterPositions() {
  const arena = document.getElementById('battle-arena');
  if (!arena) return;
  const w = arena.offsetWidth;
  const h = arena.offsetHeight;
  const size = 80;

  const myEl = document.getElementById('fighter-right');
  const oppEl = document.getElementById('fighter-left');
  if (myEl) {
    myEl.style.left = (battle.myX * (w - size)) + 'px';
    myEl.style.top = (battle.myY * (h - size)) + 'px';
  }
  if (oppEl) {
    oppEl.style.left = (battle.oppX * (w - size)) + 'px';
    oppEl.style.top = (battle.oppY * (h - size)) + 'px';
  }
}

function updateOpponentDisplay() {
  updateFighterPositions();
  renderHpSide('battle-side-left', battle.oppPicks, battle.oppIndex,
    battle.oppHp, CHARACTERS[battle.oppPicks[battle.oppIndex]].hp, 'right');
}

function updateTimer() {
  const m = Math.floor(battle.timer / 60).toString().padStart(2, '0');
  const s = (battle.timer % 60).toString().padStart(2, '0');
  document.getElementById('battle-timer').textContent = `${m}:${s}`;
}

function updateCooldownUI() {
  const btns = {
    skill: document.getElementById('btn-skill'),
    heal: document.getElementById('btn-heal'),
    ultimate: document.getElementById('btn-ultimate')
  };
  for (const [key, btn] of Object.entries(btns)) {
    const cd = battle.myCd[key];
    if (cd > 0) {
      btn.classList.add('disabled');
      let overlay = btn.querySelector('.cd-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.className = 'cd-overlay';
        btn.appendChild(overlay);
      }
      overlay.textContent = Math.ceil(cd / 10);
    } else {
      btn.classList.remove('disabled');
      const overlay = btn.querySelector('.cd-overlay');
      if (overlay) overlay.remove();
    }
  }
}

function battleTick() {
  if (!battle.active) return;

  for (const k of ['skill', 'heal', 'ultimate']) {
    if (battle.myCd[k] > 0) battle.myCd[k]--;
  }
  if (battle.myStunned > 0) battle.myStunned--;

  let dx = battle.joyDX;
  let dy = battle.joyDY;
  if (battle.keyW) dy = -1;
  else if (battle.keyS) dy = 1;
  if (battle.keyA) dx = -1;
  else if (battle.keyD) dx = 1;

  if (battle.myStunned <= 0 && (dx !== 0 || dy !== 0)) {
    const c = CHARACTERS[battle.myPicks[battle.myIndex]];
    const speed = c.speed * 0.0035;
    const len = Math.hypot(dx, dy);
    if (len > 0) {
      battle.myX += (dx / len) * speed;
      battle.myY += (dy / len) * speed;
      battle.myX = Math.max(0, Math.min(1, battle.myX));
      battle.myY = Math.max(0, Math.min(1, battle.myY));
      updateFighterPositions();
      broadcastState();
    }
  }

  updateCooldownUI();
}

function broadcastState() {
  if (battleChannel) {
    battleChannel.send({
      type: 'broadcast',
      event: 'state',
      payload: {
        from: currentPlayer.id,
        x: battle.myX,
        y: battle.myY,
        index: battle.myIndex,
        hp: battle.myHp,
        stunned: battle.myStunned > 0
      }
    });
  }
}

function distToOpp() {
  const dx = battle.myX - battle.oppX;
  const dy = battle.myY - battle.oppY;
  return Math.hypot(dx, dy);
}

function doAttack() {
  if (!battle.active || battle.myStunned > 0) return;
  const c = CHARACTERS[battle.myPicks[battle.myIndex]];
  playSfx('sfxAttack');
  if (distToOpp() < 0.22) {
    sendHit(c.attack, 'none');
  }
}

function doSkill() {
  if (!battle.active || battle.myStunned > 0) return;
  if (battle.myCd.skill > 0) return;
  const c = CHARACTERS[battle.myPicks[battle.myIndex]];
  battle.myCd.skill = c.skill.cd * 10;
  playSfx('sfxSkill');
  showEffect(battle.myPicks[battle.myIndex], 'skill', battle.myX, battle.myY);

  const d = distToOpp();
  if (c.skill.type === 'fan' && d < 0.35) {
    sendHit(c.skill.damage, c.skill.effect || 'none');
  } else if (c.skill.type === 'line' && d < 0.5) {
    sendHit(c.skill.damage, c.skill.effect || 'none');
  }
}

function doHeal() {
  if (!battle.active || battle.myStunned > 0) return;
  if (battle.myCd.heal > 0) return;
  const c = CHARACTERS[battle.myPicks[battle.myIndex]];
  battle.myCd.heal = c.heal.cd * 10;
  battle.myHp = Math.min(battle.myMaxHp, battle.myHp + c.heal.value);
  playSfx('sfxSkill');
  showToast(`+${c.heal.value} HP`);
  renderHpSide('battle-side-right', battle.myPicks, battle.myIndex, battle.myHp, battle.myMaxHp, 'left');
  broadcastState();
}

function doUltimate() {
  if (!battle.active || battle.myStunned > 0) return;
  if (battle.myCd.ultimate > 0) return;
  const c = CHARACTERS[battle.myPicks[battle.myIndex]];
  battle.myCd.ultimate = c.ultimate.cd * 10;
  playSfx('sfxUltimate');
  showEffect(battle.myPicks[battle.myIndex], 'ultimate', battle.myX, battle.myY);

  const d = distToOpp();
  if (c.ultimate.type === 'full' || c.ultimate.type === 'lock') {
    sendHit(c.ultimate.damage, 'none');
  } else if (c.ultimate.type === 'line' && d < 0.7) {
    sendHit(c.ultimate.damage, 'knockback');
  }
}

document.getElementById('btn-attack').onclick = doAttack;
document.getElementById('btn-skill').onclick = doSkill;
document.getElementById('btn-heal').onclick = doHeal;
document.getElementById('btn-ultimate').onclick = doUltimate;

function sendHit(damage, effect) {
  if (!battleChannel) return;
  const oppId = battle.isHost ? currentRoom.guest_id : currentRoom.host_id;
  battleChannel.send({
    type: 'broadcast',
    event: 'hit',
    payload: { from: currentPlayer.id, to: oppId, damage, effect }
  });
}

function applyDamageToMe(damage, effect) {
  battle.myHp = Math.max(0, battle.myHp - damage);
  playSfx('sfxHit');
  showToast(`-${damage}`, 800);

  if (effect === 'stun') {
    battle.myStunned = 15;
    showToast('被眩晕！', 1200);
  } else if (effect === 'knockback') {
    const dx = battle.myX - battle.oppX;
    const dy = battle.myY - battle.oppY;
    const d = Math.hypot(dx, dy) || 1;
    battle.myX = Math.max(0, Math.min(1, battle.myX + dx / d * 0.12));
    battle.myY = Math.max(0, Math.min(1, battle.myY + dy / d * 0.12));
    updateFighterPositions();
  }

  const fighter = document.getElementById('fighter-right');
  fighter.classList.add('hit-flash');
  setTimeout(() => fighter.classList.remove('hit-flash'), 250);

  renderHpSide('battle-side-right', battle.myPicks, battle.myIndex, battle.myHp, battle.myMaxHp, 'left');
  broadcastState();

  if (battle.myHp <= 0) handleMyDeath();
}

function handleMyDeath() {
  showToast(`${CHARACTERS[battle.myPicks[battle.myIndex]].name} 阵亡`, 1500);

  if (battle.myIndex < battle.myPicks.length - 1) {
    battle.myIndex++;
    battle.myHp = CHARACTERS[battle.myPicks[battle.myIndex]].hp;
    battle.myMaxHp = battle.myHp;
    battle.myCd = { skill: 0, heal: 0, ultimate: 0 };
    renderFighter('fighter-right', battle.myPicks[battle.myIndex], false);
    renderHpSide('battle-side-right', battle.myPicks, battle.myIndex, battle.myHp, battle.myMaxHp, 'left');
    broadcastState();
    if (battleChannel) {
      battleChannel.send({
        type: 'broadcast',
        event: 'swap',
        payload: { from: currentPlayer.id, index: battle.myIndex }
      });
    }
  } else {
    endBattle('defeat');
  }
}

// 特效显示：加载对应角色的技能图
function showEffect(charId, type, x, y) {
  const layer = document.getElementById('effect-layer');
  const arena = document.getElementById('battle-arena');
  if (!layer || !arena) return;
  const w = arena.offsetWidth;
  const h = arena.offsetHeight;

  const effect = document.createElement('div');
  effect.className = 'skill-effect';

  // 尺寸：普攻小，技能中，必杀大
  const size = type === 'ultimate' ? 160 : type === 'skill' ? 120 : 80;
  effect.style.cssText = `
    left: ${x * w}px; top: ${y * h}px;
    width: ${size}px; height: ${size}px;
  `;

  const key = `${charId}_${type}`;
  const imgPath = EFFECT_IMAGES[key];

  if (imgPath) {
    const img = document.createElement('img');
    img.src = imgPath;
    img.alt = '';
    // 图片加载失败时降级成色块
    img.onerror = () => {
      img.remove();
      const fallback = document.createElement('div');
      const color = type === 'ultimate' ? '#bf5af2' : type === 'skill' ? '#ff9f0a' : '#30d158';
      fallback.style.cssText = `
        width: 100%; height: 100%;
        background: radial-gradient(circle, ${color}, transparent);
        border-radius: 50%;
      `;
      effect.appendChild(fallback);
    };
    effect.appendChild(img);
  } else {
    const color = type === 'ultimate' ? '#bf5af2' : type === 'skill' ? '#ff9f0a' : '#30d158';
    effect.style.background = `radial-gradient(circle, ${color}, transparent)`;
    effect.style.borderRadius = '50%';
  }

  layer.appendChild(effect);
  setTimeout(() => effect.remove(), 600);
}

function endBattle(reason, fromOpponent = false) {
  if (!battle.active) return;
  battle.active = false;

  if (battle.tickInterval) { clearInterval(battle.tickInterval); battle.tickInterval = null; }
  if (battle.timerInterval) { clearInterval(battle.timerInterval); battle.timerInterval = null; }

  if (!fromOpponent && battleChannel) {
    battleChannel.send({
      type: 'broadcast',
      event: 'end',
      payload: { from: currentPlayer.id, reason }
    });
  }

  let resultMsg = '';
  if (reason === 'timeout') {
    if (battle.myHp > battle.oppHp) resultMsg = '时间到，你赢了！';
    else if (battle.myHp < battle.oppHp) resultMsg = '时间到，你输了';
    else resultMsg = '时间到，平局';
  } else if (reason === 'defeat') {
    resultMsg = '你输了';
  } else {
    resultMsg = '你赢了！';
  }

  playSfx('sfxWin');
  showToast(resultMsg, 3000);

  setTimeout(() => {
    if (currentRoom) {
      supabase.from('rooms').update({ status: 'finished', battle_result: resultMsg }).eq('id', currentRoom.id);
    }
    setTimeout(() => leaveRoom(), 2000);
  }, 2000);
}

// ---------- 摇杆 ----------
const joystick = document.getElementById('joystick');
const joystickKnob = document.getElementById('joystick-knob');
let joystickActive = false;

function updateJoystick(clientX, clientY) {
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = clientX - cx;
  let dy = clientY - cy;
  const max = rect.width / 2 - 26;
  const dist = Math.hypot(dx, dy);
  if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
  joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  const nx = dx / max;
  const ny = dy / max;
  const dead = 0.15;
  battle.joyDX = Math.abs(nx) < dead ? 0 : nx;
  battle.joyDY = Math.abs(ny) < dead ? 0 : ny;
}

joystick.addEventListener('touchstart', (e) => {
  e.preventDefault();
  joystickActive = true;
  updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
joystick.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!joystickActive) return;
  updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
joystick.addEventListener('touchend', (e) => {
  e.preventDefault();
  joystickActive = false;
  battle.joyDX = 0;
  battle.joyDY = 0;
  joystickKnob.style.transform = 'translate(-50%, -50%)';
}, { passive: false });

joystick.addEventListener('mousedown', (e) => {
  e.preventDefault();
  joystickActive = true;
  updateJoystick(e.clientX, e.clientY);
});
document.addEventListener('mousemove', (e) => {
  if (!joystickActive) return;
  e.preventDefault();
  updateJoystick(e.clientX, e.clientY);
});
document.addEventListener('mouseup', () => {
  if (!joystickActive) return;
  joystickActive = false;
  battle.joyDX = 0;
  battle.joyDY = 0;
  joystickKnob.style.transform = 'translate(-50%, -50%)';
});

// ---------- 键盘 ----------
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'w') battle.keyW = true;
  else if (k === 's') battle.keyS = true;
  else if (k === 'a') battle.keyA = true;
  else if (k === 'd') battle.keyD = true;
  else if (k === 'j') doAttack();
  else if (k === 'k') doSkill();
  else if (k === 'l') doHeal();
  else if (k === 'u') doUltimate();
});
document.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'w') battle.keyW = false;
  else if (k === 's') battle.keyS = false;
  else if (k === 'a') battle.keyA = false;
  else if (k === 'd') battle.keyD = false;
});

// 屏幕旋转时重新计算角色位置
window.addEventListener('resize', () => {
  if (battle.active) updateFighterPositions();
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    if (battle.active) updateFighterPositions();
  }, 300);
});

  });

async function loadFriendsList() {
  const statusEl = document.getElementById('friends-list-status');
  const listEl = document.getElementById('friends-list');
  setStatus(statusEl, '加载中...');
  listEl.innerHTML = '';

  const { data, error } = await supabase
    .from('friends')
    .select('*')
    .eq('status', 'accepted')
    .or(`user_id.eq.${currentPlayer.id},friend_id.eq.${currentPlayer.id}`);

  if (error) { setStatus(statusEl, '加载失败', 'err'); return; }
  if (!data.length) { setStatus(statusEl, '还没有好友，去添加吧', ''); return; }

  const otherIds = data.map(f => f.user_id === currentPlayer.id ? f.friend_id : f.user_id);
  const { data: players } = await supabase.from('players').select('id, nickname, account_id').in('id', otherIds);
  const map = Object.fromEntries((players || []).map(p => [p.id, p]));
  setStatus(statusEl, '', '');

  const canInvite = currentRoom && currentRoom.status === 'waiting' && currentRoom.host_id === currentPlayer.id;

  listEl.innerHTML = data.map(f => {
    const otherId = f.user_id === currentPlayer.id ? f.friend_id : f.user_id;
    const p = map[otherId];
    if (!p) return '';
    const inviteBtn = canInvite ? `<button class="mini-btn" data-invite="${p.id}">邀请</button>` : '';
    return `
      <div class="friend-item">
        <div class="avatar">${escapeHtml(initial(p.nickname))}</div>
        <div class="info">
          <div class="name">${escapeHtml(p.nickname)}</div>
          <div class="sub">@${escapeHtml(p.account_id)}</div>
        </div>
        <div class="actions">${inviteBtn}<button class="mini-btn secondary" data-remove="${f.id}">删除</button></div>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('[data-invite]').forEach(btn => {
    btn.onclick = async () => {
      const friendId = btn.dataset.invite;
      if (!currentRoom || currentRoom.status !== 'waiting') { alert('房间已不在等待状态'); return; }
      const { error } = await supabase.from('rooms').update({ invited_id: friendId, invite_status: 'pending' }).eq('id', currentRoom.id);
      if (error) { alert('邀请失败：' + error.message); return; }
      btn.textContent = '已邀请';
      btn.disabled = true;
    };
  });

  listEl.querySelectorAll('[data-remove]').forEach(btn => {
    btn.onclick = async () => {
      await supabase.from('friends').delete().eq('id', btn.dataset.remove);
      loadFriendsList();
    };
  });
}

async function loadRequests() {
  const statusEl = document.getElementById('requests-status');
  const listEl = document.getElementById('requests-list');
  setStatus(statusEl, '加载中...');
  listEl.innerHTML = '';

  const { data, error } = await supabase

  const senderIds = data.map(f => f.user_id);

  const map = Object.fromEntries((players || []).map(p => [p.id, p]));

}

document.getElementById('btn-friend-search').onclick = async () => {
  const q = document.getElementById('friend-search-input').value.trim();
  const resultsEl = document.getElementById('friend-search-results');
  if (!q) return resultsEl.innerHTML = '';

  const { data, error } = await supabase
    .from('players')
    .select('id, nickname, account_id')
    .or(`nickname.ilike.%${q}%,account_id.ilike.%${q}%`)
    .neq('id', currentPlayer.id)
    .limit(20);

  if (error) { resultsEl.innerHTML = '<div class="status err">搜索出错</div>'; return; }
  if (!data.length) { resultsEl.innerHTML = '<div class="status">没找到</div>'; return; }

  resultsEl.innerHTML = data.map(p => `
    <div class="friend-item">
      <div class="avatar">${escapeHtml(initial(p.nickname))}</div>
      <div class="info">
        <div class="name">${escapeHtml(p.nickname)}</div>
        <div class="sub">@${escapeHtml(p.account_id)}</div>
      </div>
      <div class="actions"><button class="mini-btn" data-add="${p.id}">加好友</button></div>
    </div>
  `).join('');

  resultsEl.querySelectorAll('[data-add]').forEach(btn => {
    btn.onclick = async () => {
      const { error } = await supabase.from('friends').insert({
        user_id: currentPlayer.id, friend_id: btn.dataset.add, status: 'pending'
      });
      if (error) {
        if (error.code === '23505') alert('已经申请过或已是好友');
        else alert('发送失败：' + error.message);
        return;
      }
      btn.textContent = '已发送';
      btn.disabled = true;
    };
  });
};

async function loadFriendBadge() {
  if (!currentPlayer) return;
  const { count } = await supabase
    .from('friends')
    .select('*', { count: 'exact', head: true })
    .eq('friend_id', currentPlayer.id)
    .eq('status', 'pending');

  const badge = document.getElementById('friend-badge');
  const reqCount = document.getElementById('req-count');
  if (count && count > 0) {
    badge.textContent = count;
    badge.classList.remove('hidden');
    reqCount.textContent = `(${count})`;
  } else {
    badge.classList.add('hidden');
    reqCount.textContent = '';
  }
}

function subscribeFriends() {
  if (friendChannel) supabase.removeChannel(friendChannel);
  friendChannel = supabase
    .channel('friends_' + currentPlayer.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'friends' }, () => loadFriendBadge())
    .subscribe();
}

function subscribeInvites() {
  if (inviteChannel) supabase.removeChannel(inviteChannel);
  inviteChannel = supabase
    .channel('invites_' + currentPlayer.id)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms' }, (payload) => {
      const room = payload.new;
      if (room.invited_id === currentPlayer.id && room.invite_status === 'pending' && room.status === 'waiting') {
        showInviteModal(room);
      }
    })
    .subscribe();
}

function showInviteModal(room) {
  const container = document.getElementById('invite-container');
  if (container.querySelector('.invite-modal')) return;
  const modal = document.createElement('div');
  modal.className = 'invite-modal';
  modal.innerHTML = `
    <div class="box">
      <h3>收到房间邀请</h3>
      <p>房间号：${escapeHtml(room.share_code)}</p>
      <button class="btn" id="btn-accept-invite">同意加入</button>
      <button class="btn secondary" id="btn-reject-invite">拒绝</button>
    </div>
  `;
  container.appendChild(modal);

  modal.querySelector('#btn-accept-invite').onclick = async () => {
    try {
      const { error } = await supabase.from('rooms')
        .update({ guest_id: currentPlayer.id, status: 'playing', invite_status: 'accepted' })
        .eq('id', room.id).is('guest_id', null);
      if (error) throw error;
      currentRoom = { ...room, guest_id: currentPlayer.id, status: 'playing', invite_status: 'accepted' };
      subscribeRoom(room.share_code);
      enterSelectPage();
      modal.remove();
    } catch (e) { alert('加入失败：' + e.message); }
  };
  modal.querySelector('#btn-reject-invite').onclick = async () => {
    await supabase.from('rooms').update({ invite_status: 'rejected' }).eq('id', room.id);
    modal.remove();
  };
}

function renderSettings() {
  document.getElementById('toggle-bgm').classList.toggle('on', settings.bgm);
  document.getElementById('toggle-sfx').classList.toggle('on', settings.sfx);
}
document.getElementById('toggle-bgm').onclick = () => {
  settings.bgm = !settings.bgm; saveSettings(); renderSettings();
  if (settings.bgm) { if (currentBgm) currentBgm.play().catch(() => {}); }
  else { if (currentBgm) currentBgm.pause(); }
};
document.getElementById('toggle-sfx').onclick = () => {
  settings.sfx = !settings.sfx; saveSettings(); renderSettings();
};

initAudio();
renderSettings();

(async () => {
  const saved = getSavedLogin();
  if (saved) {
    try { await loginWith(saved.accountId, saved.password); return; }
    catch { clearSavedLogin(); }
  }
  showView('login');
})();
</script>
