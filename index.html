<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>牦牛音乐 · 想听就有</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0a0c;--bg-soft:#121216;--bg-card:#17171c;--bg-hover:#1f1f26;--text:#f5f5f7;--text-dim:#8e8e93;--text-faint:#5a5a60;--accent:#8b5cf6;--accent-soft:rgba(139,92,246,.15);--radius:14px;--radius-sm:10px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;font-size:14px;height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer}
.app{display:flex;height:100vh}
.sidebar{width:240px;flex-shrink:0;background:var(--bg-soft);border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;padding:20px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:6px}
.brand-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#6366f1);display:flex;align-items:center;justify-content:center;font-size:16px}
.brand-name{font-size:17px;font-weight:700}
.brand-name span{color:var(--accent)}
.brand-slogan{font-size:11px;color:var(--text-faint);padding:0 8px;margin-bottom:24px}
.nav-section{margin-bottom:24px}
.nav-label{font-size:11px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;padding:0 8px;margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--text-dim);cursor:pointer;font-size:14px;font-weight:500;border:none;background:none;width:100%;text-align:left}
.nav-item:hover,.nav-item.active{background:var(--bg-hover);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item .icon{width:18px;font-size:15px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:64px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 28px;background:rgba(10,10,12,.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.05);z-index:10}
.page-title{font-size:20px;font-weight:700}
.search-box{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:8px 14px;width:260px}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:14px;width:100%}
.content{flex:1;overflow-y:auto;padding:28px 28px 32px}
.btn{padding:10px 20px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:14px;font-weight:500}
.btn-primary{background:var(--accent);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.empty{text-align:center;padding:80px 20px;color:var(--text-faint)}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.4}
.song-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px;margin-bottom:40px}
.song-card{position:relative;transition:transform .2s}
.song-card:hover{transform:translateY(-4px)}
.card-cover-wrap{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:1;background:linear-gradient(135deg,#1e1e26,#14141a);margin-bottom:12px;cursor:pointer}
.card-cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.card-cover-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;color:rgba(255,255,255,.15)}
.card-play{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;border:none;opacity:0;transform:translateY(8px);transition:all .25s}
.song-card:hover .card-play{opacity:1;transform:translateY(0)}
.card-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;cursor:pointer}
.card-artist{font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.card-artist span:hover{color:var(--accent)}
.artist-row{display:flex;gap:20px;overflow-x:auto;padding-bottom:12px;margin-bottom:32px}
.artist-card{flex-shrink:0;width:120px;text-align:center;cursor:pointer;transition:transform .2s}
.artist-card:hover{transform:translateY(-4px)}
.artist-card-avatar{width:120px;height:120px;border-radius:50%;overflow:hidden;margin-bottom:10px;background:linear-gradient(135deg,#2a2a35,#1a1a22);display:flex;align-items:center;justify-content:center;font-size:40px;color:rgba(255,255,255,.2)}
.artist-card-avatar img{width:100%;height:100%;object-fit:cover}
.artist-card-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist-card-count{font-size:11px;color:var(--text-faint);margin-top:2px}
.album-card{flex-shrink:0;width:160px;cursor:pointer;transition:transform .2s}
.album-card:hover{transform:translateY(-4px)}
.album-card-cover{width:160px;height:160px;border-radius:var(--radius);overflow:hidden;margin-bottom:10px;background:linear-gradient(135deg,#2a2a35,#1a1a22);display:flex;align-items:center;justify-content:center;font-size:48px;color:rgba(255,255,255,.15)}
.album-card-cover img{width:100%;height:100%;object-fit:cover}
.album-card-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album-card-artist{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.section-title{font-size:18px;font-weight:700}
.section-more{font-size:13px;color:var(--text-dim);cursor:pointer;background:none;border:none}
.user-row{display:flex;align-items:center;gap:14px;padding:12px;border-radius:var(--radius-sm);cursor:pointer}
.user-row:hover{background:var(--bg-hover)}
.row-cover{width:44px;height:44px;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#1e1e26,#14141a);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(255,255,255,.2)}
.row-cover img{width:100%;height:100%;object-fit:cover}
.row-info{flex:1;min-width:0}
.row-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.row-meta{font-size:12.5px;color:var(--text-dim)}
.artist-hero{display:flex;align-items:flex-end;gap:28px;padding:40px 0;margin-bottom:32px;border-bottom:1px solid rgba(255,255,255,.06)}
.artist-hero-avatar{width:180px;height:180px;border-radius:50%;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#2a2a35,#1a1a22);display:flex;align-items:center;justify-content:center;font-size:72px;color:rgba(255,255,255,.15)}
.artist-hero-avatar.album{border-radius:14px}
.artist-hero-avatar img{width:100%;height:100%;object-fit:cover}
.artist-hero-name{font-size:56px;font-weight:800;letter-spacing:-2px;margin-bottom:16px;line-height:1}
.artist-hero-meta{font-size:14px;color:var(--text-dim)}
.artist-hero-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.download-banner{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(99,102,241,.08));border:1px solid rgba(139,92,246,.3);border-radius:var(--radius);padding:20px 24px;margin-bottom:32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
@media(max-width:900px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:200;transform:translateX(-100%);transition:transform .3s}.sidebar.open{transform:translateX(0)}.menu-toggle{display:flex}.topbar{padding:0 16px;gap:12px}.page-title{font-size:17px}.search-box{width:160px;padding:7px 10px}.content{padding:20px 16px 24px}.song-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}.artist-hero{flex-direction:column;align-items:center;text-align:center;padding:24px 0}.artist-hero-avatar{width:140px;height:140px;font-size:56px}.artist-hero-name{font-size:36px}}
@media(max-width:480px){.song-grid{grid-template-columns:repeat(2,1fr);gap:12px}.search-box{display:none}}
.menu-toggle{display:none;width:36px;height:36px;border-radius:8px;background:var(--bg-card);border:none;color:var(--text);cursor:pointer;align-items:center;justify-content:center;font-size:18px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150}
.sidebar-overlay.show{display:block}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🎵</div>
      <div class="brand-name">牦牛<span>音乐</span></div>
    </div>
    <div class="brand-slogan">想听就有 · 下载 App</div>
    <div class="nav-section">
      <div class="nav-label">浏览</div>
      <button class="nav-item active" data-nav="home" onclick="nav('home')"><span class="icon">🏠</span><span>首页</span></button>
      <button class="nav-item" data-nav="all" onclick="nav('all')"><span class="icon">🎵</span><span>全部歌曲</span></button>
      <button class="nav-item" data-nav="artists" onclick="nav('artists')"><span class="icon">🎤</span><span>歌手</span></button>
      <button class="nav-item" data-nav="albums" onclick="nav('albums')"><span class="icon">💿</span><span>专辑</span></button>
    </div>
    <div class="nav-section" style="margin-top:auto;">
      <div class="nav-label">获取 App</div>
      <button class="nav-item" onclick="downloadApp()"><span class="icon">📲</span><span>下载 App</span></button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div class="page-title" id="pageTitle">首页</div>
      <div class="search-box" id="searchBox">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="搜索歌曲、歌手、专辑...">
      </div>
      <button class="btn btn-primary btn-sm" onclick="downloadApp()" style="flex-shrink:0;">📲 下载 App</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script src="config.js"></script>
<script>
// 牦牛音乐 · 预览版（只能看，不能听）
const state={allSongs:[],allArtists:[],allAlbums:[],songArtists:[],viewSongs:[],view:'home',searchKeyword:'',currentArtist:null,currentAlbum:null};
const content=document.getElementById('content'),pageTitle=document.getElementById('pageTitle'),searchInput=document.getElementById('searchInput'),searchBox=document.getElementById('searchBox');
function esc(t){const d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML}
function escAttr(t){return String(t==null?'':t).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function initial(n){return n?n.trim().charAt(0).toUpperCase():'?'}

// ---------- 下载/预览引导 ----------
function showModal(title,html){
  const old=document.getElementById('modalOverlay');if(old)old.remove();
  const o=document.createElement('div');o.id='modalOverlay';
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  o.innerHTML=`<div style="background:linear-gradient(135deg,#1a1a24,#17171c);border:1px solid rgba(139,92,246,.4);border-radius:20px;padding:32px 28px;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(139,92,246,.4);animation:pop .4s cubic-bezier(.34,1.56,.64,1);">
    <div style="font-size:56px;margin-bottom:16px;">📲</div>
    <h3 style="font-size:20px;margin-bottom:12px;color:#a78bfa;">${title}</h3>
    <p style="color:#8e8e93;font-size:14px;line-height:1.7;margin-bottom:24px;">${html}</p>
    <button class="btn btn-primary" style="width:100%;padding:12px;" onclick="document.getElementById('modalOverlay').remove()">我知道了</button>
  </div>`;
  document.body.appendChild(o);
  if(!document.getElementById('popAnim')){const s=document.createElement('style');s.id='popAnim';s.textContent='@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}';document.head.appendChild(s)}
}
function downloadApp(){
  const ua=navigator.userAgent,isAndroid=/Android|Adr/i.test(ua),isiOS=/iPhone|iPad|iPod/i.test(ua),isWX=/micromessenger/i.test(ua);
  if(isWX){showModal('请在浏览器中打开','微信内置浏览器无法下载安装包<br>请点击右上角 <b style="color:#fff;">···</b> 选择 <b style="color:#fff;">「在浏览器中打开」</b>');return}
  if(isAndroid){const a=document.createElement('a');a.href='download/yak-music.apk';a.download='yak-music.apk';document.body.appendChild(a);a.click();document.body.removeChild(a)}
  else if(isiOS){showModal('iOS 版即将上线','牦牛音乐 iOS 版正在开发中<br>敬请期待 🎵')}
  else{showModal('请在手机上打开','用手机浏览器访问此页面<br>点击「下载 App」安装牦牛音乐')}
}
function previewOnly(){showModal('下载 App 才能听歌','网页版仅提供曲库预览<br>完整播放功能请下载牦牛音乐 App 🎵')}

// ---------- 导航 ----------
function nav(v){
  state.view=v;state.searchKeyword='';searchInput.value='';
  document.querySelectorAll('.nav-item[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===v));
  searchBox.style.display=['home','all','artists','albums'].includes(v)?'flex':'none';
  if(v==='home')renderHome();else if(v==='all')renderAllSongs();else if(v==='artists')renderArtists();else if(v==='albums')renderAlbums();else if(v==='artist')renderArtistDetail();else if(v==='album')renderAlbumDetail();
  closeSidebar();
}

// ---------- 首页 ----------
function renderHome(){
  pageTitle.textContent='首页';
  if(!state.allSongs.length){content.innerHTML='<div class="empty"><div class="empty-icon">🎵</div><div class="empty-text">还没有歌曲</div></div>';return}
  const am={};state.songArtists.forEach(r=>am[r.artist_id]=(am[r.artist_id]||0)+1);
  const topA=state.allArtists.map(a=>({...a,_c:am[a.id]||0})).filter(a=>a._c>0).sort((a,b)=>b._c-a._c).slice(0,12);
  const al={};state.allSongs.forEach(s=>{if(s.album_id)al[s.album_id]=(al[s.album_id]||0)+1});
  const topAl=state.allAlbums.map(a=>({...a,_c:al[a.id]||0})).filter(a=>a._c>0).slice(0,8);
  const recent=state.allSongs.slice(-8).reverse();
  let html=`<div class="download-banner"><div style="font-size:40px;">📲</div><div style="flex:1;min-width:200px;"><div style="font-size:16px;font-weight:700;margin-bottom:4px;">下载牦牛音乐 App</div><div style="font-size:13px;color:var(--text-dim);">网页版仅预览，完整播放请下载 App</div></div><button class="btn btn-primary" onclick="downloadApp()" style="flex-shrink:0;">立即下载</button></div>`;
  if(topA.length)html+=`<div class="section-header"><div class="section-title">热门歌手</div><button class="section-more" onclick="nav('artists')">查看全部 →</button></div><div class="artist-row">${topA.map(a=>`<div class="artist-card" onclick="openArtist('${escAttr(a.name)}')"><div class="artist-card-avatar">${a.avatar_url?'<img src="'+a.avatar_url+'">':initial(a.name)}</div><div class="artist-card-name">${esc(a.name)}</div><div class="artist-card-count">${a._c} 首</div></div>`).join('')}</div>`;
  if(topAl.length)html+=`<div class="section-header"><div class="section-title">最新专辑</div><button class="section-more" onclick="nav('albums')">查看全部 →</button></div><div class="artist-row">${topAl.map(a=>{const an=a.artist_id?(state.allArtists.find(x=>x.id===a.artist_id)||{}).name||'未知歌手':'未知歌手';return `<div class="album-card" onclick="openAlbum(${a.id})"><div class="album-card-cover">${a.cover_url?'<img src="'+a.cover_url+'">':'💿'}</div><div class="album-card-name">${esc(a.name)}</div><div class="album-card-artist">${esc(an)}</div></div>`}).join('')}</div>`;
  if(recent.length)html+=`<div class="section-header"><div class="section-title">最新添加</div><button class="section-more" onclick="nav('all')">查看全部 →</button></div><div class="song-grid">${recent.map(renderSongCard).join('')}</div>`;
  content.innerHTML=html;
}

function renderSongCard(s){
  const cover=s._cover;
  const ah=(s._artists||[]).map((a,i)=>(i>0?' / ':'')+`<span onclick="event.stopPropagation(); openArtist('${escAttr(a.name)}')">${esc(a.name)}</span>`).join('')||'未知歌手';
  return `<div class="song-card"><div class="card-cover-wrap" onclick="previewOnly()">${cover?'<img src="'+cover+'">':'<div class="card-cover-placeholder">🎵</div>'}<button class="card-play" onclick="event.stopPropagation(); previewOnly()">▶</button></div><div class="card-title" onclick="previewOnly()">${esc(s.title)}</div><div class="card-artist">${ah}</div></div>`;
}

function renderAllSongs(){
  pageTitle.textContent='全部歌曲';
  state.viewSongs=filterBySearch(state.allSongs);
  if(!state.viewSongs.length){content.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">没有找到歌曲</div></div>';return}
  content.innerHTML='<div class="song-grid">'+state.viewSongs.map(renderSongCard).join('')+'</div>';
}

function filterBySearch(songs){
  if(!state.searchKeyword)return songs.slice();
  const kw=state.searchKeyword.toLowerCase();
  return songs.filter(s=>{
    const a=(s._artists||[]).map(x=>x.name).join(' ');
    return (s.title||'').toLowerCase().includes(kw)||a.toLowerCase().includes(kw)||(s._album?s._album.name:'').toLowerCase().includes(kw);
  });
}

// ---------- 歌手 ----------
function renderArtists(){
  pageTitle.textContent='歌手';
  const m={};state.songArtists.forEach(r=>m[r.artist_id]=(m[r.artist_id]||0)+1);
  const arts=state.allArtists.map(a=>({...a,_c:m[a.id]||0})).filter(a=>a._c>0).sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  if(!arts.length){content.innerHTML='<div class="empty"><div class="empty-icon">🎤</div><div class="empty-text">暂无歌手</div></div>';return}
  content.innerHTML='<div class="song-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));">'+arts.map(a=>`<div class="artist-card" style="width:100%;" onclick="openArtist('${escAttr(a.name)}')"><div class="artist-card-avatar" style="width:100%;height:auto;aspect-ratio:1;">${a.avatar_url?'<img src="'+a.avatar_url+'">':initial(a.name)}</div><div class="artist-card-name">${esc(a.name)}</div><div class="artist-card-count">${a._c} 首</div></div>`).join('')+'</div>';
}

function openArtist(name){state.currentArtist=name;nav('artist')}

function renderArtistDetail(){
  const name=state.currentArtist;if(!name){nav('home');return}
  pageTitle.textContent='歌手详情';searchBox.style.display='none';
  const artist=state.allArtists.find(a=>a.name===name);
  let songs=[];
  if(artist){const ids=state.songArtists.filter(r=>r.artist_id===artist.id).map(r=>r.song_id);songs=state.allSongs.filter(s=>ids.includes(s.id))}
  const cover=artist&&artist.avatar_url?artist.avatar_url:null;
  const bio=artist&&artist.bio?artist.bio:'';
  content.innerHTML=`<div class="artist-hero"><div class="artist-hero-avatar">${cover?'<img src="'+cover+'">':initial(name)}</div><div><div class="artist-hero-label">歌手</div><div class="artist-hero-name">${esc(name)}</div><div class="artist-hero-meta">共 <b style="color:var(--text)">${songs.length}</b> 首歌曲${bio?' · '+esc(bio):''}</div></div></div><div id="artistSongs"></div>`;
  state.viewSongs=songs;renderUserSongList();
}

// ---------- 专辑 ----------
function renderAlbums(){
  pageTitle.textContent='专辑';
  const m={};state.allSongs.forEach(s=>{if(s.album_id)m[s.album_id]=(m[s.album_id]||0)+1});
  const als=state.allAlbums.map(a=>({...a,_c:m[a.id]||0})).filter(a=>a._c>0).sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  if(!als.length){content.innerHTML='<div class="empty"><div class="empty-icon">💿</div><div class="empty-text">暂无专辑</div></div>';return}
  content.innerHTML='<div class="artist-row" style="flex-wrap:wrap;">'+als.map(a=>{const an=a.artist_id?(state.allArtists.find(x=>x.id===a.artist_id)||{}).name||'':'未知歌手';return `<div class="album-card" onclick="openAlbum(${a.id})"><div class="album-card-cover">${a.cover_url?'<img src="'+a.cover_url+'">':'💿'}</div><div class="album-card-name">${esc(a.name)}</div><div class="album-card-artist">${esc(an||'未知歌手')} · ${a._c} 首</div></div>`}).join('')+'</div>';
}

function openAlbum(id){state.currentAlbum=id;nav('album')}

function renderAlbumDetail(){
  const id=state.currentAlbum;if(!id){nav('home');return}
  const album=state.allAlbums.find(a=>a.id===id);if(!album){nav('albums');return}
  pageTitle.textContent='专辑详情';searchBox.style.display='none';
  const songs=state.allSongs.filter(s=>s.album_id===id);
  const an=album.artist_id?(state.allArtists.find(x=>x.id===album.artist_id)||{}).name||'未知歌手':'未知歌手';
  content.innerHTML=`<div class="artist-hero"><div class="artist-hero-avatar album">${album.cover_url?'<img src="'+album.cover_url+'">':'💿'}</div><div><div class="artist-hero-label">专辑</div><div class="artist-hero-name">${esc(album.name)}</div><div class="artist-hero-meta"><span style="cursor:pointer;color:var(--accent);" onclick="openArtist('${escAttr(an)}')">${esc(an)}</span> · 共 <b style="color:var(--text)">${songs.length}</b> 首</div></div></div><div id="artistSongs"></div>`;
  state.viewSongs=songs;renderUserSongList();
}

function renderUserSongList(){
  const el=document.getElementById('artistSongs');if(!el)return;
  if(!state.viewSongs.length){el.innerHTML='<div class="empty"><div class="empty-text">暂无歌曲</div></div>';return}
  el.innerHTML=state.viewSongs.map(s=>{
    const cover=s._cover;
    const a=(s._artists||[]).map(x=>x.name).join(' / ')||'未知歌手';
    return `<div class="user-row" onclick="previewOnly()"><div class="row-cover">${cover?'<img src="'+cover+'">':'🎵'}</div><div class="row-info"><div class="row-title">${esc(s.title)}</div><div class="row-meta">${esc(a)} · ${esc(s._album?s._album.name:'无专辑')}</div></div></div>`;
  }).join('');
}

// ---------- 搜索 ----------
let searchTimer=null;
searchInput.addEventListener('input',function(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    state.searchKeyword=searchInput.value.trim();
    if(state.view==='home'||state.view==='all'){renderAllSongs();pageTitle.textContent=state.searchKeyword?'搜索：'+state.searchKeyword:'全部歌曲'}
  },200);
});

// ---------- 侧边栏 ----------
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('show')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('show')}

// ---------- 启动 ----------
(async function(){
  try{
    const [artsRes,albsRes,songsRes,relsRes]=await Promise.all([
      supabaseClient.from('artists').select('*'),
      supabaseClient.from('albums').select('*'),
      supabaseClient.from('songs').select('*').order('created_at',{ascending:true}),
      supabaseClient.from('song_artists').select('*')
    ]);
    state.allArtists=artsRes.data||[];
    state.allAlbums=albsRes.data||[];
    state.allSongs=songsRes.data||[];
    state.songArtists=relsRes.data||[];
    state.allSongs.forEach(s=>{
      const rel=state.songArtists.filter(r=>r.song_id===s.id).sort((a,b)=>(a.position||0)-(b.position||0));
      s._artists=rel.map(r=>{const a=state.allArtists.find(x=>x.id===r.artist_id);return a?{id:a.id,name:a.name,avatar_url:a.avatar_url}:null}).filter(Boolean);
      if(!s._artists.length&&s.artist)s._artists=s.artist.split(/[,、/&]/).map(n=>({id:null,name:n.trim(),avatar_url:null})).filter(a=>a.name);
      const alb=s.album_id?state.allAlbums.find(a=>a.id===s.album_id):null;
      s._album=alb||null;
      s._cover=s.cover_url||(alb?alb.cover_url:null);
    });
  }catch(e){console.error(e)}
  renderHome();
})();
</script>
</body>
