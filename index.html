<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牦牛影视</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<style>
  :root {
    --bg: #08080a; --panel: rgba(20, 20, 25, 0.7); --border: rgba(255, 255, 255, 0.08);
    --text: #f0f0f5; --muted: #8e8e9c; --accent: #ff4757; --accent-hover: #ff6b81;
    --radius: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at top right, #1a1015 0%, var(--bg) 50%);
    color: var(--text); font-family: -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

  /* 顶栏 */
  .topbar {
    display: flex; align-items: center; gap: 20px; padding: 0 40px; height: 72px;
    position: sticky; top: 0; z-index: 100; background: rgba(8, 8, 10, 0.6);
    backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
  }
  .brand { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
  .brand span { color: var(--accent); }
  .top-actions { margin-left: auto; display: flex; gap: 14px; align-items: center; }
  .btn-outline {
    background: transparent; color: var(--text); text-decoration: none;
    padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--border); cursor: pointer; transition: .2s;
  }
  .btn-outline:hover { background: rgba(255,255,255,0.05); }

  /* 搜索区 */
  .hero { padding: 80px 20px 60px; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
  .hero.hide { display: none; }
  .hero h1 { font-size: 38px; font-weight: 800; margin-bottom: 12px; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { color: var(--muted); font-size: 15px; margin-bottom: 32px; }
  .big-search { width: 100%; max-width: 680px; position: relative; }
  .big-search input {
    width: 100%; height: 64px; padding: 0 24px 0 60px; border-radius: 99px;
    border: 1px solid var(--border); background: rgba(25, 25, 30, 0.8); color: #fff;
    font-size: 18px; outline: none; backdrop-filter: blur(10px); transition: .3s;
  }
  .big-search input:focus { border-color: var(--accent); }
  .big-search .ico { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); font-size: 20px; color: var(--muted); }

  /* 网格 */
  .main-content { padding: 0 40px 60px; max-width: 1600px; margin: 0 auto; }
  .section-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
  .section-title::before { content: ''; width: 4px; height: 18px; background: var(--accent); border-radius: 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px; }
  .card {
    background: var(--panel); border-radius: var(--radius); overflow: hidden;
    cursor: pointer; transition: .3s; border: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-6px); border-color: rgba(255,71,87,0.5); box-shadow: 0 15px 30px rgba(0,0,0,0.6); }
  .card-cover {
    width: 100%; aspect-ratio: 3/4; background: linear-gradient(135deg, #1f1f24, #111);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800; color: var(--muted); text-align: center; padding: 20px;
    word-break: break-all;
  }
  .card-info { padding: 14px; }
  .card-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .card-meta { font-size: 12px; color: var(--muted); text-align: center; }

  /* 全屏播放器 */
  .player-modal {
    position: fixed; inset: 0; z-index: 1000; background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(15px); display: none; flex-direction: column; opacity: 0; transition: opacity 0.3s;
  }
  .player-modal.active { display: flex; opacity: 1; }
  .pm-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .pm-title { font-size: 20px; font-weight: 700; }
  .pm-close { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; transition: .2s; }
  .pm-close:hover { background: var(--accent); transform: rotate(90deg); }
  .pm-body { display: flex; flex: 1; overflow: hidden; }
  .pm-video-area { flex: 1; display: flex; flex-direction: column; background: #000; }
  .pm-screen { width: 100%; flex: 1; position: relative; }
  video { width: 100%; height: 100%; display: block; object-fit: contain; }
  .pm-episodes { width: 340px; background: #111; border-left: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; }
  .pm-ep-head { padding: 20px; font-size: 16px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .pm-ep-list { flex: 1; overflow-y: auto; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ep-btn { background: rgba(255,255,255,0.05); border: 1px solid transparent; color: #ccc; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: .2s; text-align: center; }
  .ep-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .ep-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 弹窗通用 */
  .modal-overlay { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: #121216; border: 1px solid var(--border); width: 100%; max-width: 420px;
    border-radius: 20px; padding: 30px; animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes scaleUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-box h3 { font-size: 22px; margin-bottom: 8px; text-align: center; }
  .modal-box .sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 24px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .form-group input, .form-group textarea {
    width: 100%; padding: 12px 16px; background: #0a0a0c; border: 1px solid var(--border);
    border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: .2s;
  }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .modal-actions button { flex: 1; height: 42px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: .2s; border: none; }
  .btn-cancel { background: transparent; border: 1px solid var(--border) !important; color: var(--text); }
  .btn-cancel:hover { background: #222; }
  .btn-submit { background: var(--accent); color: #fff; }
  .btn-submit:hover { background: var(--accent-hover); }

  @media (max-width: 768px) {
    .topbar { padding: 0 20px; } .main-content { padding: 0 20px 40px; }
    .hero { padding: 50px 20px 40px; } .hero h1 { font-size: 28px; }
    .pm-body { flex-direction: column; } .pm-episodes { width: 100%; height: 250px; border-left: none; border-top: 1px solid rgba(255,255,255,0.1); }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">牦牛<span>影视</span></div>
  <div class="top-actions">
    <button class="btn-outline" id="openSubmitBtn">✉️ 用户投稿</button>
  </div>
</header>

<section class="hero" id="heroSection">
  <h1>探索无限<em>精彩</em></h1>
  <p>发现你喜爱的影视剧集，极速播放，尽享视听盛宴</p>
  <div class="big-search">
    <span class="ico">🔍</span>
    <input id="searchInput" type="text" placeholder="搜索剧名..." autocomplete="off">
  </div>
</section>

<main class="main-content">
  <div class="section-title" id="listTitle">最近更新</div>
  <div class="grid" id="gridArea">
    <div style="grid-column:1/-1; text-align:center; padding:60px; color:var(--muted)">正在加载精彩内容...</div>
  </div>
</main>

<!-- 全屏播放器 -->
<div class="player-modal" id="playerModal">
  <div class="pm-header">
    <div class="pm-title" id="pmTitle">正在播放</div>
    <button class="pm-close" id="pmCloseBtn">✕</button>
  </div>
  <div class="pm-body">
    <div class="pm-video-area">
      <div class="pm-screen"><video id="video" controls playsinline></video></div>
    </div>
    <div class="pm-episodes">
      <div class="pm-ep-head">选集播放</div>
      <div class="pm-ep-list" id="pmEpList"></div>
    </div>
  </div>
</div>

<!-- 用户投稿弹窗 -->
<div class="modal-overlay" id="submitModal">
  <div class="modal-box">
    <h3>✨ 投稿影视</h3>
    <p class="sub">独乐乐不如众乐乐！有想看但本站没有的剧？告诉我们，我们尽力去搞！</p>
    
    <div class="form-group">
      <label>剧名（必填）</label>
      <input id="subTitle" type="text" placeholder="如：三体 / 权力的游戏">
    </div>
    <div class="form-group">
      <label>备注（选填）</label>
      <textarea id="subNote" placeholder="如：求高清版 / 某个m3u8链接..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="closeSubmitBtn">取消</button>
      <button class="btn-submit" id="submitBtn">提交投稿</button>
    </div>
  </div>
</div>

<!-- 底部版权与声明 -->
<footer style="text-align:center; padding:40px 20px; color:var(--muted); font-size:12px; border-top:1px solid var(--border); line-height:1.8;">
  <div style="margin-bottom:12px; max-width:600px; margin-inline:auto; color:#888;">
    ⚠️ 免责声明：此网站可能含第三方广告，广告收入均为影视方所有，本网站不涉及任何盈利！
  </div>
  <div>灿然科技 ©2026 版权所有</div>
  <div>牦牛工作室</div>
</footer>

<script>
  const SUPABASE_URL = 'https://ymcoydzvtxtxaijtbuuy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_5aF8sRl4HyXNCh5zZnmVgA_SLiuPUBB';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const hero = document.getElementById('heroSection');
  const searchInput = document.getElementById('searchInput');
  const gridArea = document.getElementById('gridArea');
  const listTitle = document.getElementById('listTitle');
  const playerModal = document.getElementById('playerModal');
  const pmCloseBtn = document.getElementById('pmCloseBtn');
  const pmTitle = document.getElementById('pmTitle');
  const pmEpList = document.getElementById('pmEpList');
  const videoEl = document.getElementById('video');
  
  const submitModal = document.getElementById('submitModal');
  const openSubmitBtn = document.getElementById('openSubmitBtn');
  const closeSubmitBtn = document.getElementById('closeSubmitBtn');
  const submitBtn = document.getElementById('submitBtn');

  let dramas = [], keyword = '', hls = null;

  // 排序
  function chineseToNumber(str) {
    const map = { '零':0, '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9, '十':10 };
    if (str.includes('十')) { const p = str.split('十'); return (p[0]?map[p[0]]:1)*10 + (p[1]?map[p[1]]:0); }
    return map[str] || 0;
  }
  function getEpNumber(name) {
    if (!name) return Infinity;
    const str = String(name);
    let m = str.match(/\d+/); if (m) return parseInt(m[0], 10);
    m = str.match(/[一二三四五六七八九十]+/); if (m) return chineseToNumber(m[0]);
    return Infinity;
  }
  function naturalCompare(a, b) {
    const na = getEpNumber(a), nb = getEpNumber(b);
    return na !== nb ? na - nb : String(a).localeCompare(String(b), 'zh-CN');
  }

  // 播放
  function playM3U8(url) {
    if (!url) return;
    if (hls) { hls.destroy(); hls = null; }
    if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      videoEl.src = url; videoEl.play().catch(() => {});
    } else if (Hls.isSupported()) {
      hls = new Hls({ enableWorker: true, capLevelToPlayerSize: true });
      hls.loadSource(url); hls.attachMedia(videoEl);
      hls.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play().catch(() => {}));
    } else { videoEl.src = url; videoEl.play().catch(() => {}); }
  }

  // 加载数据
  async function loadData() {
    const { data, error } = await db.from('dramas').select('id,title,created_at,episodes(id,name,url)').order('created_at', { ascending: false });
    if (error) { gridArea.innerHTML = '<div class="empty">加载失败</div>'; return; }
    dramas = data || [];
    dramas.forEach(d => { if (d.episodes) d.episodes.sort((a, b) => naturalCompare(a.name, b.name)); });
    renderGrid();
  }

  function renderGrid() {
    const kw = keyword.trim().toLowerCase();
    const list = dramas.filter(d => !kw || d.title.toLowerCase().includes(kw));
    if (list.length === 0) {
      gridArea.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)">没有找到相关影视</div>`;
      return;
    }
    gridArea.innerHTML = '';
    list.forEach(d => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-cover">${d.title}</div>
        <div class="card-info">
          <div class="card-title">${d.title}</div>
          <div class="card-meta">${d.episodes?.length || 0} 集全</div>
        </div>
      `;
      card.addEventListener('click', () => openPlayer(d));
      gridArea.appendChild(card);
    });
  }

  function openPlayer(drama) {
    pmTitle.textContent = drama.title;
    pmEpList.innerHTML = '';
    if (drama.episodes && drama.episodes.length > 0) {
      drama.episodes.forEach((ep, idx) => {
        const btn = document.createElement('div');
        btn.className = 'ep-btn';
        btn.textContent = ep.name;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('on'));
          btn.classList.add('on');
          playM3U8(ep.url);
        });
        pmEpList.appendChild(btn);
        if (idx === 0) btn.click();
      });
    } else {
      pmEpList.innerHTML = '<div style="grid-column:1/-1;color:#666;text-align:center;padding:20px;">暂无剧集</div>';
      if (hls) { hls.destroy(); hls = null; }
      videoEl.removeAttribute('src'); videoEl.load();
    }
    playerModal.classList.add('active');
  }

  pmCloseBtn.addEventListener('click', () => {
    playerModal.classList.remove('active');
    if (hls) { hls.destroy(); hls = null; }
    videoEl.pause();
  });

  searchInput.addEventListener('input', (e) => {
    keyword = e.target.value;
    hero.classList.toggle('hide', !!keyword.trim());
    listTitle.textContent = keyword.trim() ? '搜索结果' : '最近更新';
    renderGrid();
  });

  // 投稿
  openSubmitBtn.addEventListener('click', () => submitModal.classList.add('active'));
  closeSubmitBtn.addEventListener('click', () => submitModal.classList.remove('active'));

  submitBtn.addEventListener('click', async () => {
    const title = document.getElementById('subTitle').value.trim();
    const note = document.getElementById('subNote').value.trim();
    if (!title) { alert('请填写剧名'); return; }

    submitBtn.textContent = '提交中...'; submitBtn.disabled = true;
    const { error } = await db.from('submissions').insert({ title, note });
    submitBtn.textContent = '提交投稿'; submitBtn.disabled = false;

    if (error) { alert('投稿失败：' + error.message); }
    else {
      alert('🎉 投稿成功！感谢你的分享，我们会尽快安排上架。');
      submitModal.classList.remove('active');
      document.getElementById('subTitle').value = '';
      document.getElementById('subNote').value = '';
    }
  });

  loadData();
</script>
</body>
</html>
