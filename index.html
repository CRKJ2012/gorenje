<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>牦牛音乐</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* 歌手横向卡片 */
    .artist-row {
      display: flex; gap: 20px; overflow-x: auto;
      padding-bottom: 12px; margin-bottom: 32px;
    }
    .artist-row::-webkit-scrollbar { height: 6px; }
    .artist-row::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    .artist-card {
      flex-shrink: 0; width: 120px; text-align: center;
      cursor: pointer; transition: transform 0.2s;
    }
    .artist-card:hover { transform: translateY(-4px); }
    .artist-card-avatar {
      width: 120px; height: 120px; border-radius: 50%;
      overflow: hidden; margin-bottom: 10px;
      background: linear-gradient(135deg, #2a2a35, #1a1a22);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; color: rgba(255,255,255,0.2);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border: 2px solid transparent;
      transition: border 0.2s;
    }
    .artist-card:hover .artist-card-avatar { border-color: var(--accent); }
    .artist-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .artist-card-name {
      font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .artist-card-count { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

    /* 段落标题 */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .section-title { font-size: 18px; font-weight: 700; letter-spacing: -0.2px; }
    .section-more {
      font-size: 13px; color: var(--text-dim); cursor: pointer;
      background: none; border: none; font-family: inherit;
    }
    .section-more:hover { color: var(--accent); }

    /* 歌曲卡片底部操作栏 */
    .card-actions {
      display: flex; gap: 6px; margin-top: 8px;
    }
    .card-actions .icon-btn {
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--text-dim);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      transition: all 0.15s;
    }
    .card-actions .icon-btn:hover {
      background: var(--bg-hover); color: var(--text); border-color: rgba(139,92,246,0.3);
    }
    .card-actions .icon-btn.liked { color: #ef4444; border-color: rgba(239,68,68,0.3); }

    /* 歌词面板 */
    .lyrics-panel {
      position: fixed;
      inset: 0;
      background: rgba(10,10,12,0.96);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      z-index: 300;
      display: none;
      flex-direction: column;
      padding: 32px;
    }
    .lyrics-panel.show { display: flex; animation: fadeIn 0.3s ease; }

    .lyrics-header {
      display: flex; align-items: center; gap: 16px; margin-bottom: 24px;
    }
    .lyrics-close {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--bg-card); border: none;
      color: var(--text); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; transition: background 0.15s;
    }
    .lyrics-close:hover { background: var(--bg-hover); }
    .lyrics-song-info { flex: 1; min-width: 0; }
    .lyrics-song-title { font-size: 16px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lyrics-song-artist { font-size: 13px; color: var(--text-dim); }

    .lyrics-body {
      flex: 1;
      display: flex; gap: 40px; min-height: 0;
    }
    .lyrics-cover-wrap {
      width: 320px; flex-shrink: 0;
      display: flex; flex-direction: column; gap: 20px;
    }
    .lyrics-cover {
      width: 100%; aspect-ratio: 1; border-radius: 16px;
      background: linear-gradient(135deg, #1e1e26, #14141a);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 80px; color: rgba(255,255,255,0.15);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .lyrics-cover img { width: 100%; height: 100%; object-fit: cover; }

    .lyrics-scroll {
      flex: 1; overflow-y: auto;
      padding: 40vh 0;
      scroll-behavior: smooth;
      mask-image: linear-gradient(to bottom, transparent 0%, #000 25%, #000 75%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 25%, #000 75%, transparent 100%);
    }
    .lyrics-scroll::-webkit-scrollbar { width: 4px; }
    .lyrics-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .lyric-line {
      padding: 12px 0;
      font-size: 20px;
      font-weight: 500;
      color: var(--text-faint);
      transition: all 0.3s ease;
      line-height: 1.5;
      cursor: pointer;
    }
    .lyric-line:hover { color: var(--text-dim); }
    .lyric-line.active {
      color: var(--text);
      font-size: 24px;
      font-weight: 700;
    }
    .lyric-line.pure { color: var(--text-dim); font-style: italic; }

    @media (max-width: 900px) {
      .lyrics-body { flex-direction: column; gap: 20px; }
      .lyrics-cover-wrap { width: 100%; flex-direction: row; align-items: center; gap: 16px; }
      .lyrics-cover { width: 120px; height: 120px; border-radius: 12px; font-size: 40px; }
      .lyrics-scroll { padding: 20vh 0; }
      .lyric-line { font-size: 17px; }
      .lyric-line.active { font-size: 20px; }
      .artist-card { width: 100px; }
      .artist-card-avatar { width: 100px; height: 100px; }
    }
  </style>
</head>
<body>

<div class="app">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🎵</div>
      <div class="brand-name">牦牛<span>音乐</span></div>
    </div>

    <div class="nav-section">
      <div class="nav-label">浏览</div>
      <button class="nav-item active" onclick="showHome()" id="navHome">
        <span class="icon">🏠</span>
        <span>首页</span>
      </button>
      <button class="nav-item" onclick="showAllSongs()" id="navAll">
        <span class="icon">🎵</span>
        <span>全部歌曲</span>
        <span class="count" id="countAll">0</span>
      </button>
      <button class="nav-item" onclick="showArtists()" id="navArtists">
        <span class="icon">🎤</span>
        <span>歌手</span>
      </button>
    </div>

    <div class="nav-section">
      <div class="nav-label">我的音乐</div>
      <button class="nav-item" onclick="showLiked()" id="navLiked">
        <span class="icon">❤️</span>
        <span>我喜欢的</span>
      </button>
      <button class="nav-item" onclick="showMyPlaylists()" id="navPlaylists">
        <span class="icon">📁</span>
        <span>我的歌单</span>
      </button>
    </div>

    <div class="nav-section" id="userSection">
      <div class="nav-label">账号</div>
      <button class="nav-item" onclick="location.href='auth.html'" id="navLogin">
        <span class="icon">👤</span>
        <span>登录 / 注册</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div class="page-title" id="pageTitle">首页</div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索歌曲或歌手...">
      </div>
    </div>

    <div class="content" id="content">
      <div class="empty"><div class="empty-icon">🎵</div><div class="empty-text">加载中...</div></div>
    </div>
  </main>
</div>

<!-- 歌词面板 -->
<div class="lyrics-panel" id="lyricsPanel">
  <div class="lyrics-header">
    <button class="lyrics-close" onclick="closeLyrics()">✕</button>
    <div class="lyrics-song-info">
      <div class="lyrics-song-title" id="lyricsTitle">—</div>
      <div class="lyrics-song-artist" id="lyricsArtist">—</div>
    </div>
  </div>
  <div class="lyrics-body">
    <div class="lyrics-cover-wrap">
      <div class="lyrics-cover" id="lyricsCover">🎵</div>
    </div>
    <div class="lyrics-scroll" id="lyricsScroll">
      <div class="lyric-line pure">纯音乐，请欣赏</div>
    </div>
  </div>
</div>

<!-- 底部播放器 -->
<div class="player" id="player">
  <div class="player-song">
    <div class="player-cover" id="playerCover">🎵</div>
    <div class="player-info">
      <div class="player-title" id="playerTitle">未在播放</div>
      <div class="player-artist" id="playerArtist">—</div>
    </div>
  </div>

  <div class="player-center">
    <div class="player-controls">
      <button class="player-btn" onclick="prevSong()" title="上一首">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="player-btn player-btn-play" id="playBtn" onclick="togglePlay()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="player-btn" onclick="nextSong()" title="下一首">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
      <button class="player-btn" onclick="openLyrics()" title="歌词" id="lyricsBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </button>
    </div>
    <div class="player-progress-row">
      <span class="time" id="currentTime">0:00</span>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="time right" id="totalTime">0:00</span>
    </div>
  </div>

  <div class="player-right">
    <button class="volume-btn" onclick="toggleMute()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" id="volumeIcon">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
      </svg>
    </button>
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
  </div>
</div>

<audio id="audio"></audio>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  // ============================================================
  // 牦牛音乐 · 用户端
  // ============================================================

  const audio = document.getElementById('audio');
  const player = document.getElementById('player');
  const playerCover = document.getElementById('playerCover');
  const playerTitle = document.getElementById('playerTitle');
  const playerArtist = document.getElementById('playerArtist');
  const playIcon = document.getElementById('playIcon');
  const progressTrack = document.getElementById('progressTrack');
  const progressFill = document.getElementById('progressFill');
  const currentTimeEl = document.getElementById('currentTime');
  const totalTimeEl = document.getElementById('totalTime');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeIcon = document.getElementById('volumeIcon');
  const content = document.getElementById('content');
  const pageTitle = document.getElementById('pageTitle');
  const countAll = document.getElementById('countAll');
  const searchInput = document.getElementById('searchInput');

  let allSongs = [];
  let viewSongs = [];
  let currentIndex = 0;
  let isPlaying = false;
  let currentView = 'home';
  let currentUser = null;
  let likedSongIds = new Set();
  let lyricsData = [];
  let lyricsActiveIndex = -1;

  const PLAY_PATH = 'M8 5v14l11-7z';
  const PAUSE_PATH = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';

  // ---------- 工具 ----------
  function formatTime(seconds) {
    if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text == null ? '' : text;
    return div.innerHTML;
  }
  function escapeAttr(text) {
    return String(text == null ? '' : text).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }
  function getInitial(name) {
    if (!name) return '?';
    return name.trim().charAt(0).toUpperCase();
  }

  // ---------- 初始化用户 ----------
  async function initUser() {
    const session = await getSession();
    if (session) {
      currentUser = session.user;
      const { data } = await supabaseClient
        .from('liked_songs').select('song_id').eq('user_id', currentUser.id);
      likedSongIds = new Set((data || []).map(function(x) { return x.song_id; }));
      renderUserNav();
    } else {
      renderUserNav();
    }
  }

  function renderUserNav() {
    const section = document.getElementById('userSection');
    if (currentUser) {
      const meta = currentUser.user_metadata || {};
      const nickname = meta.nickname || meta.phone || '我';
      section.innerHTML = `
        <div class="nav-label">账号</div>
        <button class="nav-item" onclick="location.href='profile.html'">
          <span class="icon">👤</span>
          <span>${escapeHtml(nickname)}</span>
        </button>
      `;
    } else {
      section.innerHTML = `
        <div class="nav-label">账号</div>
        <button class="nav-item" onclick="location.href='auth.html'">
          <span class="icon">👤</span>
          <span>登录 / 注册</span>
        </button>
      `;
    }
  }

  // ---------- 加载数据 ----------
  async function loadSongs() {
    const { data, error } = await supabaseClient
      .from('songs').select('*').order('created_at', { ascending: true });

    if (error) {
      content.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">加载失败：' + escapeHtml(error.message) + '</div></div>';
      return;
    }

    allSongs = data || [];
    countAll.textContent = allSongs.length;
    viewSongs = allSongs;
    renderHome();
  }

  // ---------- 首页 ----------
  function renderHome() {
    currentView = 'home';
    pageTitle.textContent = '首页';
    setActiveNav('navHome');

    const artistMap = new Map();
    allSongs.forEach(function(s) {
      const name = (s.artist || '').trim() || '未知歌手';
      if (!artistMap.has(name)) artistMap.set(name, { count: 0, cover: s.cover_url });
      const item = artistMap.get(name);
      item.count++;
      if (!item.cover && s.cover_url) item.cover = s.cover_url;
    });
    const artists = Array.from(artistMap.entries())
      .map(function(e) { return { name: e[0], count: e[1].count, cover: e[1].cover }; })
      .sort(function(a, b) { return b.count - a.count; })
      .slice(0, 12);

    const recentSongs = allSongs.slice(-8).reverse();

    let html = '';

    if (artists.length > 0) {
      html += `
        <div class="section-header">
          <div class="section-title">热门歌手</div>
          <button class="section-more" onclick="showArtists()">查看全部 →</button>
        </div>
        <div class="artist-row">
          ${artists.map(function(a) {
            const avatar = a.cover ? '<img src="' + a.cover + '">' : getInitial(a.name);
            return `
              <div class="artist-card" onclick="location.href='artist.html?name=${encodeURIComponent(a.name)}'">
                <div class="artist-card-avatar">${avatar}</div>
                <div class="artist-card-name">${escapeHtml(a.name)}</div>
                <div class="artist-card-count">${a.count} 首</div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    if (recentSongs.length > 0) {
      html += `
        <div class="section-header">
          <div class="section-title">最新添加</div>
          <button class="section-more" onclick="showAllSongs()">查看全部 →</button>
        </div>
        <div class="song-grid">
          ${recentSongs.map(function(song) { return renderSongCard(song); }).join('')}
        </div>
      `;
    }

    if (allSongs.length === 0) {
      html = '<div class="empty"><div class="empty-icon">🎵</div><div class="empty-text">还没有歌曲，去后台上传吧</div></div>';
    }

    content.innerHTML = html;
  }

  // ---------- 歌曲卡片 ----------
  function renderSongCard(song) {
    const isActive = isPlaying && viewSongs[currentIndex] && viewSongs[currentIndex].id === song.id;
    const coverHtml = song.cover_url
      ? '<img src="' + song.cover_url + '">'
      : '<div class="card-cover-placeholder">🎵</div>';
    const liked = likedSongIds.has(song.id);
    return `
      <div class="song-card${isActive ? ' active' : ''}">
        <div class="card-cover-wrap" onclick="playSongById(${song.id})">
          ${coverHtml}
          <button class="card-play" onclick="event.stopPropagation(); playSongById(${song.id})">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>
        <div class="card-title" onclick="playSongById(${song.id})">${escapeHtml(song.title)}</div>
        <div class="card-artist" onclick="playSongById(${song.id})">${escapeHtml(song.artist || '未知歌手')}</div>
        <div class="card-actions">
          <button class="icon-btn${liked ? ' liked' : ''}" onclick="event.stopPropagation(); toggleLike(${song.id})" title="喜欢">
            ${liked ? '❤️' : '🤍'}
          </button>
          <button class="icon-btn" onclick="event.stopPropagation(); addToPlaylist(${song.id})" title="添加到歌单">➕</button>
          <button class="icon-btn" onclick="event.stopPropagation(); showSongInfo(${song.id})" title="详情">⋯</button>
        </div>
      </div>
    `;
  }

  // ---------- 全部歌曲 ----------
  function showAllSongs() {
    currentView = 'all';
    pageTitle.textContent = '全部歌曲';
    setActiveNav('navAll');
    viewSongs = allSongs;
    renderSongGrid();
  }

  function renderSongGrid() {
    if (viewSongs.length === 0) {
      content.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">没有找到歌曲</div></div>';
      return;
    }
    content.innerHTML = '<div class="song-grid">' + viewSongs.map(function(song) {
      return renderSongCard(song);
    }).join('') + '</div>';
  }

  // ---------- 歌手列表 ----------
  function showArtists() {
    currentView = 'artists';
    pageTitle.textContent = '歌手';
    setActiveNav('navArtists');

    const artistMap = new Map();
    allSongs.forEach(function(s) {
      const name = (s.artist || '').trim() || '未知歌手';
      if (!artistMap.has(name)) artistMap.set(name, { count: 0, cover: s.cover_url });
      const item = artistMap.get(name);
      item.count++;
      if (!item.cover && s.cover_url) item.cover = s.cover_url;
    });
    const artists = Array.from(artistMap.entries())
      .map(function(e) { return { name: e[0], count: e[1].count, cover: e[1].cover }; })
      .sort(function(a, b) { return a.name.localeCompare(b.name, 'zh'); });

    if (artists.length === 0) {
      content.innerHTML = '<div class="empty"><div class="empty-icon">🎤</div><div class="empty-text">暂无歌手</div></div>';
      return;
    }

    content.innerHTML = `
      <div class="song-grid" style="grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));">
        ${artists.map(function(a) {
          const avatar = a.cover ? '<img src="' + a.cover + '">' : getInitial(a.name);
          return `
            <div class="artist-card" style="width:100%;" onclick="location.href='artist.html?name=${encodeURIComponent(a.name)}'">
              <div class="artist-card-avatar" style="width:100%;height:auto;aspect-ratio:1;">${avatar}</div>
              <div class="artist-card-name">${escapeHtml(a.name)}</div>
              <div class="artist-card-count">${a.count} 首</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // ---------- 我喜欢的 ----------
  async function showLiked() {
    currentView = 'liked';
    pageTitle.textContent = '我喜欢的';
    setActiveNav('navLiked');

    if (!currentUser) {
      content.innerHTML = '<div class="empty"><div class="empty-icon">🔒</div><div class="empty-text">请先登录<br><br><button class="btn btn-primary" onclick="location.href=\'auth.html\'">去登录</button></div></div>';
      return;
    }

    const { data, error } = await supabaseClient
      .from('liked_songs').select('song_id').eq('user_id', currentUser.id);

    if (error) {
      content.innerHTML = '<div class="empty"><div class="empty-text">加载失败</div></div>';
      return;
    }

    const ids = (data || []).map(function(x) { return x.song_id; });
    viewSongs = allSongs.filter(function(s) { return ids.includes(s.id); });

    if (viewSongs.length === 0) {
      content.innerHTML = '<div class="empty"><div class="empty-icon">❤️</div><div class="empty-text">还没有喜欢的歌曲</div></div>';
      return;
    }
    renderSongGrid();
  }

  // ---------- 我的歌单 ----------
  function showMyPlaylists() {
    currentView = 'playlists';
    pageTitle.textContent = '我的歌单';
    setActiveNav('navPlaylists');

    if (!currentUser) {
      content.innerHTML = '<div class="empty"><div class="empty-icon">🔒</div><div class="empty-text">请先登录<br><br><button class="btn btn-primary" onclick="location.href=\'auth.html\'">去登录</button></div></div>';
      return;
    }
    location.href = 'profile.html';
  }

  // ---------- 导航高亮 ----------
  function setActiveNav(id) {
    ['navHome', 'navAll', 'navArtists', 'navLiked', 'navPlaylists'].forEach(function(x) {
      const el = document.getElementById(x);
      if (el) el.classList.toggle('active', x === id);
    });
  }

  // ---------- 播放 ----------
  function playSongById(id) {
    let i = viewSongs.findIndex(function(s) { return s.id === id; });
    if (i === -1) {
      viewSongs = allSongs;
      i = viewSongs.findIndex(function(s) { return s.id === id; });
    }
    if (i === -1) return;
    playIndex(i);
  }

  function playIndex(i) {
    if (i < 0 || i >= viewSongs.length) return;
    if (i === currentIndex && audio.src && !audio.paused) {
      togglePlay();
      return;
    }

    currentIndex = i;
    const song = viewSongs[i];
    audio.src = song.audio_url;
    playerTitle.textContent = song.title;
    playerArtist.textContent = song.artist || '未知歌手';

    if (song.cover_url) {
      playerCover.innerHTML = '<img src="' + song.cover_url + '">';
    } else {
      playerCover.innerHTML = '🎵';
    }

    progressFill.style.width = '0%';
    currentTimeEl.textContent = '0:00';

    updateLyricsPanel(song);

    audio.play().catch(function(err) { console.warn(err); });
    refreshView();
  }

  function togglePlay() {
    if (!audio.src) {
      if (viewSongs.length > 0) playIndex(0);
      return;
    }
    if (isPlaying) audio.pause();
    else audio.play().catch(function(err) { console.warn(err); });
  }

  function prevSong() {
    if (viewSongs.length === 0) return;
    playIndex((currentIndex - 1 + viewSongs.length) % viewSongs.length);
  }

  function nextSong() {
    if (viewSongs.length === 0) return;
    playIndex((currentIndex + 1) % viewSongs.length);
  }

  function refreshView() {
    if (currentView === 'home') renderHome();
    else if (currentView === 'all') renderSongGrid();
    else if (currentView === 'liked') renderSongGrid();
    else if (currentView === 'artists') showArtists();
  }

  // ---------- 音频事件 ----------
  audio.addEventListener('play', function() {
    isPlaying = true;
    playIcon.querySelector('path').setAttribute('d', PAUSE_PATH);
    refreshView();
    if (currentUser && viewSongs[currentIndex]) {
      supabaseClient.from('play_history').insert({
        user_id: currentUser.id, song_id: viewSongs[currentIndex].id
      }).then(function(){});
    }
  });

  audio.addEventListener('pause', function() {
    isPlaying = false;
    playIcon.querySelector('path').setAttribute('d', PLAY_PATH);
    refreshView();
  });

  audio.addEventListener('timeupdate', function() {
    if (audio.duration && isFinite(audio.duration)) {
      const percent = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = percent + '%';
      currentTimeEl.textContent = formatTime(audio.currentTime);
      totalTimeEl.textContent = formatTime(audio.duration);
    }
    syncLyrics();
  });

  audio.addEventListener('loadedmetadata', function() {
    totalTimeEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('ended', nextSong);

  progressTrack.addEventListener('click', function(e) {
    if (!audio.duration) return;
    const rect = progressTrack.getBoundingClientRect();
    const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    audio.currentTime = percent * audio.duration;
  });

  // ---------- 音量 ----------
  function updateVolume() {
    audio.volume = parseFloat(volumeSlider.value);
  }
  let lastVolume = 0.8;
  function toggleMute() {
    if (audio.volume > 0) { lastVolume = audio.volume; volumeSlider.value = 0; }
    else { volumeSlider.value = lastVolume; }
    updateVolume();
  }
  volumeSlider.addEventListener('input', updateVolume);

  // ---------- 歌词 ----------
  async function updateLyricsPanel(song) {
    document.getElementById('lyricsTitle').textContent = song.title;
    document.getElementById('lyricsArtist').textContent = song.artist || '未知歌手';
    document.getElementById('lyricsCover').innerHTML = song.cover_url
      ? '<img src="' + song.cover_url + '">' : '🎵';

    const scrollEl = document.getElementById('lyricsScroll');

    if (!song.lyrics) {
      lyricsData = [];
      scrollEl.innerHTML = '<div class="lyric-line pure">纯音乐，请欣赏</div>';
      return;
    }

    scrollEl.innerHTML = '<div class="lyric-line pure">加载歌词中...</div>';

    try {
      const res = await fetch(song.lyrics);
      const text = await res.text();
      lyricsData = parseLRC(text);

      if (lyricsData.length === 0) {
        scrollEl.innerHTML = '<div class="lyric-line pure">暂无歌词</div>';
        return;
      }

      scrollEl.innerHTML = lyricsData.map(function(line, i) {
        return '<div class="lyric-line" data-index="' + i + '" onclick="seekToLyric(' + i + ')">' + escapeHtml(line.text) + '</div>';
      }).join('');

      lyricsActiveIndex = -1;
    } catch (err) {
      console.warn('歌词加载失败', err);
      scrollEl.innerHTML = '<div class="lyric-line pure">歌词加载失败</div>';
    }
  }

  function parseLRC(text) {
    const lines = text.split(/\r?\n/);
    const result = [];
    const timeReg = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;

    lines.forEach(function(line) {
      const matches = [];
      let m;
      timeReg.lastIndex = 0;
      while ((m = timeReg.exec(line)) !== null) {
        matches.push({
          min: parseInt(m[1]),
          sec: parseInt(m[2]),
          ms: m[3] ? parseInt(m[3].padEnd(3, '0')) : 0
        });
      }
      const txt = line.replace(timeReg, '').trim();
      if (!txt && matches.length === 0) return;
      matches.forEach(function(t) {
        result.push({ time: t.min * 60 + t.sec + t.ms / 1000, text: txt });
      });
    });

    result.sort(function(a, b) { return a.time - b.time; });
    return result;
  }

  function syncLyrics() {
    if (lyricsData.length === 0) return;
    if (!document.getElementById('lyricsPanel').classList.contains('show')) return;

    const t = audio.currentTime;
    let idx = -1;
    for (let i = 0; i < lyricsData.length; i++) {
      if (lyricsData[i].time <= t + 0.2) idx = i;
      else break;
    }

    if (idx === lyricsActiveIndex) return;
    lyricsActiveIndex = idx;

    const lines = document.querySelectorAll('#lyricsScroll .lyric-line');
    lines.forEach(function(el, i) {
      el.classList.toggle('active', i === idx);
    });

    if (idx >= 0 && lines[idx]) {
      const scrollEl = document.getElementById('lyricsScroll');
      const lineEl = lines[idx];
      const target = lineEl.offsetTop - scrollEl.clientHeight / 2 + lineEl.clientHeight / 2;
      scrollEl.scrollTo({ top: target, behavior: 'smooth' });
    }
  }

  function seekToLyric(i) {
    if (lyricsData[i]) {
      audio.currentTime = lyricsData[i].time;
      if (audio.paused) audio.play().catch(function(){});
    }
  }

  function openLyrics() {
    if (!viewSongs[currentIndex]) return;
    document.getElementById('lyricsPanel').classList.add('show');
    updateLyricsPanel(viewSongs[currentIndex]);
  }
  function closeLyrics() {
    document.getElementById('lyricsPanel').classList.remove('show');
  }

  // ---------- 喜欢 / 歌单 ----------
  async function toggleLike(songId) {
    if (!currentUser) {
      if (confirm('需要登录后才能收藏，去登录？')) location.href = 'auth.html';
      return;
    }
    if (likedSongIds.has(songId)) {
      await supabaseClient.from('liked_songs').delete()
        .eq('user_id', currentUser.id).eq('song_id', songId);
      likedSongIds.delete(songId);
    } else {
      await supabaseClient.from('liked_songs').insert({
        user_id: currentUser.id, song_id: songId
      });
      likedSongIds.add(songId);
    }
    refreshView();
  }

  async function addToPlaylist(songId) {
    if (!currentUser) {
      if (confirm('需要登录后才能添加歌单，去登录？')) location.href = 'auth.html';
      return;
    }
    const { data: playlists } = await supabaseClient
      .from('playlists').select('id, name').eq('user_id', currentUser.id).order('created_at', { ascending: false });

    const list = playlists || [];

    let options = list.map(function(p, i) { return (i + 1) + '. ' + p.name; }).join('\n');
    options += '\n\n输入数字选择歌单，或输入 0 新建歌单';

    const input = prompt('添加到哪个歌单？\n\n' + (options || '还没有歌单，输入 0 新建'));

    if (input === null) return;

    if (input.trim() === '0' || list.length === 0) {
      const name = prompt('新歌单名称：');
      if (!name || !name.trim()) return;
      const { data: created, error: createErr } = await supabaseClient
        .from('playlists').insert({ user_id: currentUser.id, name: name.trim() }).select().single();
      if (createErr) { alert('创建失败：' + createErr.message); return; }
      const { error } = await supabaseClient.from('playlist_songs').insert({
        playlist_id: created.id, song_id: songId
      });
      if (error && error.code !== '23505') { alert('添加失败：' + error.message); return; }
      alert('已添加到「' + name + '」');
      return;
    }

    const idx = parseInt(input.trim()) - 1;
    if (isNaN(idx) || idx < 0 || idx >= list.length) { alert('无效选择'); return; }

    const { error } = await supabaseClient
      .from('playlist_songs').insert({ playlist_id: list[idx].id, song_id: songId });

    if (error) {
      if (error.code === '23505') alert('这首歌已经在歌单里了');
      else alert('添加失败：' + error.message);
      return;
    }
    alert('已添加到「' + list[idx].name + '」');
  }

  function showSongInfo(songId) {
    const song = allSongs.find(function(s) { return s.id === songId; });
    if (!song) return;
    alert(
      '歌名：' + song.title + '\n' +
      '歌手：' + (song.artist || '未知') + '\n' +
      '专辑：' + (song.album || '无') + '\n' +
      '歌词：' + (song.lyrics ? '有' : '无')
    );
  }

  // ---------- 搜索 ----------
  let searchTimer = null;
  searchInput.addEventListener('input', function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() {
      const kw = searchInput.value.trim().toLowerCase();
      if (!kw) { refreshView(); return; }

      viewSongs = allSongs.filter(function(s) {
        return (s.title || '').toLowerCase().includes(kw) ||
               (s.artist || '').toLowerCase().includes(kw) ||
               (s.album || '').toLowerCase().includes(kw);
      });
      pageTitle.textContent = '搜索：' + searchInput.value;
      renderSongGrid();
    }, 200);
  });

  // ---------- 侧边栏 ----------
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }

  // ---------- 键盘 ----------
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.code === 'ArrowLeft' && audio.duration) audio.currentTime = Math.max(0, audio.currentTime - 5);
    else if (e.code === 'ArrowRight' && audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
    else if (e.code === 'Escape') closeLyrics();
  });

  // ---------- 暴露给 HTML 调用 ----------
  window.showHome = renderHome;
  window.showAllSongs = showAllSongs;
  window.showArtists = showArtists;
  window.showLiked = showLiked;
  window.showMyPlaylists = showMyPlaylists;
  window.playSongById = playSongById;
  window.togglePlay = togglePlay;
  window.prevSong = prevSong;
  window.nextSong = nextSong;
  window.toggleLike = toggleLike;
  window.addToPlaylist = addToPlaylist;
  window.showSongInfo = showSongInfo;
  window.openLyrics = openLyrics;
  window.closeLyrics = closeLyrics;
  window.seekToLyric = seekToLyric;
  window.toggleMute = toggleMute;
  window.toggleSidebar = toggleSidebar;
  window.closeSidebar = closeSidebar;

  // ---------- 启动 ----------
  (async function() {
    await initUser();
    await loadSongs();
    updateVolume();
  })();
</script>
